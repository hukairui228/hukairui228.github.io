/* ============================================================
   11c. 结账排名 · 积分排行榜 · AI 阶段复盘
   每人借了几手（每手 = 一份起始筹码）都记着；结账时按「现在的筹码 − 借的总额」排名，
   名次和盈利换成积分，存进本机的积分榜（跨局累计）。
   ============================================================ */
const BOARD_STORE='mh_board';
const RANK_PTS=[10,6,3,1];
function boardLoad(){
  try{ const b=JSON.parse(localStorage.getItem(BOARD_STORE)||'null'); if(b&&b.players) return b; }catch(e){}
  return {players:{},history:[]};
}
function boardSave(b){ try{ localStorage.setItem(BOARD_STORE,JSON.stringify(b)); }catch(e){} }
/* 本局排名：牌局进行到一半时，本手已经下的注先算回各自身上（这一手作废） */
function settleRows(){
  const mid=G.phase==='betting'||G.phase==='deal';
  const rows=G.players.filter(function(p){ return !p.left||p.isHuman; }).map(function(p){
    const buyins=p.buyins||1;
    const chips=p.stack+(mid?(p.committed||0):0);
    const net=chips-buyins*G.startStack;
    return {id:p.id,name:p.name,tag:p.isMe?'你':(p.persona?p.persona.tag:'真人'),isMe:!!p.isMe,isAI:!!p.isAI,
      buyins:buyins,chips:chips,net:net,hands:(p.st&&p.st.hands)||0};
  });
  rows.sort(function(a,b){ return b.net-a.net||a.buyins-b.buyins; });
  rows.forEach(function(r,i){
    r.rank=i+1;
    /* 积分 = 名次分（10/6/3/1）+ 盈利分（每赢一手起始筹码 +5，输了扣，四舍五入） */
    r.rankPts=RANK_PTS[i]||0;
    r.netPts=Math.round(r.net/G.startStack*5);
    r.points=r.rankPts+r.netPts;
  });
  return rows;
}
function boardKey(r){ return r.isMe&&r.name==='你'?'你（本机）':r.name; }
function settleCommit(rows){
  const b=boardLoad();
  rows.forEach(function(r){
    const k=boardKey(r);
    const e=b.players[k]||(b.players[k]={name:k,ai:r.isAI,points:0,sessions:0,firsts:0,net:0,buyins:0,hands:0});
    e.points+=r.points; e.sessions++; if(r.rank===1) e.firsts++;
    e.net+=r.net; e.buyins+=r.buyins; e.hands+=r.hands; e.ai=r.isAI;
  });
  b.history.unshift({at:Date.now(),hands:G.handNo,rows:rows.map(function(r){ return {name:boardKey(r),net:r.net,buyins:r.buyins,points:r.points,rank:r.rank}; })});
  if(b.history.length>30) b.history.length=30;
  boardSave(b);
  return b;
}
function boardRows(){
  const b=boardLoad();
  return Object.keys(b.players).map(function(k){ return b.players[k]; })
    .sort(function(x,y){ return y.points-x.points||y.net-x.net; });
}
function sgn(n){ return (n>0?'+':'')+fmt(n); }
function settleTable(rows){
  return '<table class="rk"><thead><tr><th>#</th><th>玩家</th><th>借了</th><th>筹码</th><th>盈亏</th><th>积分</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr class="'+(r.isMe?'me':'')+'"><td>'+r.rank+'</td><td>'+esc(r.name)+'<small>'+esc(r.tag)+'</small></td>'+
        '<td>'+r.buyins+' 手</td><td class="num">'+fmt(r.chips)+'</td>'+
        '<td class="num '+(r.net>=0?'up':'down')+'">'+sgn(r.net)+'</td>'+
        '<td class="num">'+sgn(r.points)+'<small>名次 '+r.rankPts+' · 盈利 '+sgn(r.netPts)+'</small></td></tr>';
    }).join('')+'</tbody></table>';
}
function boardTable(){
  const rows=boardRows();
  if(!rows.length) return '<div class="lobbynote">还没有结过账。打完一局点「结账并记分」，这里就会有排名。</div>';
  return '<table class="rk"><thead><tr><th>#</th><th>玩家</th><th>积分</th><th>局数</th><th>第一</th><th>累计盈亏</th><th>累计借</th></tr></thead><tbody>'+
    rows.map(function(e,i){
      return '<tr class="'+(e.name==='你（本机）'?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(e.name)+(e.ai?'<small>电脑</small>':'')+'</td>'+
        '<td class="num">'+fmt(e.points)+'</td><td>'+e.sessions+'</td><td>'+e.firsts+'</td>'+
        '<td class="num '+(e.net>=0?'up':'down')+'">'+sgn(e.net)+'</td><td>'+e.buyins+' 手</td></tr>';
    }).join('')+'</tbody></table>';
}
/* 本阶段（这一局）的打法数据，给本地总结和 AI 总结共用 */
function sessionFacts(){
  const me=human();
  const t=statOf(me);
  const dec=COACH.session||[];
  const bad=dec.filter(function(d){ return d.grade==='bad'; });
  const byLesson={};
  bad.forEach(function(d){ if(d.lesson) byLesson[d.lesson]=(byLesson[d.lesson]||0)+1; });
  const thisSession=Object.keys(byLesson).sort(function(a,b){ return byLesson[b]-byLesson[a]; })
    .map(function(k){ return {key:k,n:byLesson[k],text:LESSON[k]}; });
  return {me:me,t:t,dec:dec,bad:bad,thisSession:thisSession,allTime:leakTop(5)};
}
function localSessionTips(f){
  const out=[], t=f.t;
  f.thisSession.slice(0,3).forEach(function(x){ out.push('这局犯了 '+x.n+' 次：'+x.text); });
  if(t.hands>=10){
    if(t.vpip>0.45) out.push('入池率 '+pctTxt(t.vpip)+' 太高：一半以上的手牌都进了池。先把起手牌收紧到 25%~30%。');
    else if(t.vpip<0.15) out.push('入池率只有 '+pctTxt(t.vpip)+'：太紧了，庄位和关煞位可以多偷盲。');
    if(t.vpip>0.2&&t.pfr<t.vpip*0.4) out.push('翻前加注 '+pctTxt(t.pfr)+' 远低于入池 '+pctTxt(t.vpip)+'：平跟太多。想玩就加注，别平跟。');
    if(t.foldBet>0.65) out.push('面对下注弃牌 '+pctTxt(t.foldBet)+'：对手只要下注你就跑，Duke、Mia 会专门偷你。');
    if(t.foldBet<0.25&&t.hands>=15) out.push('面对下注只弃 '+pctTxt(t.foldBet)+'：跟得太多，被价值下注榨干。');
    if(t.af<0.7) out.push('激进度 '+t.af.toFixed(1)+' 偏低：多数时候在跟注，主动下注太少。');
  }
  if(!out.length) out.push('这局没有明显的老毛病，保持住。多打几手，数据会更准。');
  return out;
}
const SESSION_SYS='你是「午夜德扑」的私人德州扑克教练，给学员做一局打完后的阶段复盘，目标是改掉他反复出现的策略问题。\n'+
  '- 只根据给出的数据，不编造牌局细节。\n'+
  '- 结构：先一句话总评；然后列出最多 3 个「反复出现的问题」，每个写清楚：问题是什么、证据（数据或次数）、下次具体怎么做（可以直接执行的规则，比如「被加注时只用 TT+/AQ+ 继续」）；'+
  '最后给一个「下一局只练一件事」的练习目标。\n'+
  '- 优先挑出现次数最多、最费钱的问题；如果有跨局反复出现的老毛病，一定要点名。\n'+
  '- 中文口语，不超过 300 字。可以用「1. 2. 3.」编号，不要用 markdown 标题和加粗。';
function sessionMessages(f,rows){
  const t=f.t, my=rows.find(function(r){ return r.isMe; })||{};
  const sit={
    本局手数:G.handNo, 名次:my.rank+' / '+rows.length, 借了几手:my.buyins, 盈亏:my.net,
    打法数据:{入池率:pctTxt(t.vpip),翻前加注:pctTxt(t.pfr),面对下注弃牌:pctTxt(t.foldBet),
      面对持续下注弃牌:pctTxt(t.fcb),激进度:t.af.toFixed(2),摊牌率:pctTxt(t.wtsd),被看到的诈唬:t.bluffs},
    本局决定数:f.dec.length, 本局明显失误数:f.bad.length,
    本局失误类型:f.thisSession.map(function(x){ return x.text+'（'+x.n+' 次）'; }),
    本局失误样例:f.bad.slice(-6).map(function(d){
      return STREET_NAMES[d.street][1]+'：'+({fold:'弃牌',check:'过牌',call:'跟注',raise:'加注'}[d.type]||d.type)+
        '，当时胜率 '+pctTxt(d.eq)+(d.need?'、需要 '+pctTxt(d.potOdds):'')+'，系统建议 '+d.advLabel;
    }),
    跨局老毛病:f.allTime.map(function(x){ return x.text+'（累计 '+x.n+' 次）'; }),
    同桌对手:rows.filter(function(r){ return !r.isMe; }).map(function(r){ return r.name+'（'+r.tag+'）盈亏 '+r.net; })
  };
  return [{role:'system',content:SESSION_SYS},{role:'user',content:JSON.stringify(sit)}];
}
function openSettle(){

const LESSON_TITLE={
  pf_open_raise:'开局：该加注的牌',pf_steal:'庄位偷盲',pf_open_fold:'开局：该弃的牌',pf_sb_complete:'小盲补齐',

  pf_vs_raise_dominated:'被加注：弱踢脚大牌',pf_vs_raise_trash:'被加注：垃圾牌',pf_bb_defend:'大盲防守',pf_vs_3bet:'面对 3-bet',

/* ---------- 正确率（实战 / 练习，按局面类型累计，并按天记趋势） ---------- */
const ACC_STORE='mh_acc';
function accLoad(){
  try{ const a=JSON.parse(localStorage.getItem(ACC_STORE)||'null'); if(a&&a.cats) return a; }catch(e){}
  return {cats:{},days:[]};
}
function accRecord(key,src,ok){
  if(!key) return;
  const a=accLoad();
  const c=a.cats[key]||(a.cats[key]={real:{n:0,ok:0},drill:{n:0,ok:0}});
  c[src].n++; if(ok) c[src].ok++;
  const d=new Date(), day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let row=a.days.find(function(x){ return x.d===day; });
  if(!row){ row={d:day,real:{n:0,ok:0},drill:{n:0,ok:0}}; a.days.push(row); }
  row[src].n++; if(ok) row[src].ok++;
  if(a.days.length>60) a.days.splice(0,a.days.length-60);
  try{ localStorage.setItem(ACC_STORE,JSON.stringify(a)); }catch(e){}
}

  const rec={no:G.handNo,at:Date.now(),hole:me.hole.map(cc),board:G.board.map(cc),meId:me.id,

    dec:(H&&H.decisions||[]).map(function(d){

  const list=handsLoad().filter(function(x){ return !(x.no===rec.no&&Math.abs(x.at-rec.at)<5000); });

const RANKS_DESC=[14,13,12,11,10,9,8,7,6,5,4,3,2];
function cellHole(i,j){
  const a=RANKS_DESC[i], b=RANKS_DESC[j];
  if(i===j) return [{r:a,s:'s'},{r:a,s:'h'}];
  if(i<j) return [{r:a,s:'s'},{r:b,s:'s'}];     /* 右上：同花 */
  return [{r:b,s:'s'},{r:a,s:'h'}];              /* 左下：不同花 */
}
/* 当前牌局对应哪张表 */
function chartSpotNow(){
  const me=human();

  const pfR=(G.hist||[]).filter(function(h){ return h.st===0&&h.raise; }).length;
  const need=Math.max(0,G.currentBet-me.streetBet);
  if(pfR===0) return me.id===G.sbId?'sb':(G.players.indexOf(me)===G.button?'btn':'ep');
  if(pfR>=2) return '3bet';
  if(me.id===G.bbId) return G.currentBet/G.bb<=2.5?'bb25':'bb3';
  const a=coachAnalysis(me);
  return a.inPos?'ip':'oop';
}

/* ---------- 2. 专项练习 ---------- */
const DRILL_TOPICS=[
  ['mix','综合'],['leaks','我的老毛病'],['open','开局'],['bb','大盲面对加注'],['ip','有位置面对加注'],['3bet','面对 3-bet'],['post','翻后：跟还是弃']
];
const DRILL_N=10, DRILL_SECS=20;
function lessonTopic(k){
  if(/^pf_(open|steal|sb_)/.test(k)) return 'open';
  if(k==='pf_vs_3bet'||k==='pf_vs_allin') return '3bet';
  if(/^pf_(vs_raise|bb_defend)/.test(k)) return Math.random()<0.6?'bb':'ip';
  if(/^post_/.test(k)) return 'post';
  return 'mix';
}
function randDeck(){ const d=makeDeck(); shuffle(d); return d; }
/* 按牌型类别挑一手牌，用来针对老毛病出题 */
function holeOfClass(want){
  for(let t=0;t<400;t++){ const d=randDeck(), h=[d[0],d[1]]; if(!want||pfClass(h)===want||(want==='suited'&&/^suited/.test(pfClass(h)))) return h; }
  const d=randDeck(); return [d[0],d[1]];
}
function drillClassFor(lesson){
  return {pf_vs_raise_dominated:'dominated',pf_vs_raise_pair:'pair',pf_vs_raise_suited:'suited',pf_vs_raise_broadway:'broadway',
    pf_vs_raise_trash:'trash',pf_vs_raise_premium:'premium',pf_vs_raise_strong:'strong'}[lesson]||null;
}
function drillMake(topic,focus){
  let tp=topic;
  if(tp==='mix') tp=rpick(['open','bb','ip','3bet','post','post']);
  if(tp==='leaks'){
    const top=leakTop(4);
    focus=top.length?rpick(top).key:null;
    tp=focus?lessonTopic(focus):rpick(['bb','ip','post']);
  }
  const villain=rpick(PERSONA_POOL);
  /* 翻前题：按局面挑一手「有讨论价值」的牌（全是 AA 或 72o 的题没意思） */
  const pick=function(){
    const want=drillClassFor(focus);
    if(want&&Math.random()<0.65) return holeOfClass(want);
    for(let t=0;t<30;t++){ const d=randDeck(), h=[d[0],d[1]], pc=pfClass(h); if(pc!=='trash'||Math.random()<0.15) return h; }
    const d=randDeck(); return [d[0],d[1]];
  };
  if(tp==='open'){
    const pos=rpick(['ep','btn','sb']), h=pick();
    const sc={spot:'open',late:pos==='btn',isSB:pos==='sb'};
    const posCN={ep:'前位（第一个说话）',btn:'庄位',sb:'小盲'}[pos];
    return {type:'open',hole:h,board:[],acts:['fold','call','raise'],rule:pfRule(h,sc),
      text:'你在'+posCN+'，前面的人都弃牌了。盲注 5/10，每人 1,000。',villain:null};
  }
  if(tp==='bb'||tp==='ip'||tp==='oop'){
    const h=pick(), rb=Math.random()<0.3?2.5:3;
    const sc=tp==='bb'?{spot:'vsRaise',isBB:true,inPos:false,cheap:true,raiseBB:rb}:{spot:'vsRaise',isBB:false,inPos:true,cheap:true,raiseBB:3};
    return {type:tp,hole:h,board:[],acts:['fold','call','raise'],rule:pfRule(h,sc),villain:villain,
      text:(tp==='bb'?'你在大盲。':'你在庄位。')+villain.name+'（'+villain.tag+'）加注到 '+(rb*10)+'，其他人都弃牌。每人 1,000。'};
  }
  if(tp==='3bet'){
    const h=holeOfClass(Math.random()<0.5?null:rpick(['premium','strong','broadway','pair']));
    const sc={spot:'vs3bet',cheap3:true};
    return {type:'3bet',hole:h,board:[],acts:['fold','call','raise'],rule:pfRule(h,sc),villain:villain,
      text:'你开局加注到 30，'+villain.name+'（'+villain.tag+'）再加注到 100。每人 1,000。'};
  }
  /* 翻后题：给手牌、牌面、底池、对手下注，判断跟还是弃 */
  for(let t=0;t<60;t++){
    const d=randDeck(), h=[d[0],d[1]], st=rpick([1,1,2,3]), board=d.slice(2,2+st+2);
    const c=classifyHand(h,board);
    if(c.tier==='air'&&Math.random()<0.6) continue;
    const pot=rpick([60,90,120,160,200]), bet=Math.round(pot*rpick([0.33,0.5,0.66,0.75,1,1.25])/5)*5;
    const eq=rangeEquity(h,board,[{pfMin:0.55,agg:1,bluff:villain.bluff}],300);
    const po=bet/(pot+bet*2);
    const rule=postRule(c,eq,po,st,villain.bluff);
    if(focus&&/^post_/.test(focus)&&rule.lesson!==focus&&t<40) continue;
    return {type:'post',hole:h,board:board,acts:['fold','call','raise'],rule:rule,villain:villain,eq:eq,po:po,cls:c,
      text:STREET_NAMES[st][1]+'。底池 '+pot+'（对手下注前），'+villain.name+'（'+villain.tag+'）下注 '+bet+'，轮到你。'};
  }
  return drillMake('open');
}
function drillStart(topic,focus){
  TRAIN.tab='drill';
  TRAIN.drill={topic:topic,focus:focus||null,i:0,qs:[],ans:[],q:null,left:DRILL_SECS,answered:false};
  drillNext();
}
function drillNext(){
  const D=TRAIN.drill;
  if(D.i>=DRILL_N){ D.q=null; D.done=true; renderTrain(); return; }
  D.q=drillMake(D.topic,D.focus); D.answered=false; D.left=DRILL_SECS; D.i++;
  renderTrain();
  drillStopTimer();
  D.timer=setInterval(function(){
    if(!TRAIN.drill||TRAIN.drill.answered) return;
    TRAIN.drill.left--;
    const el=document.getElementById('drClock');
    if(el) el.textContent=TRAIN.drill.left+'s';
    if(TRAIN.drill.left<=0) drillAnswer(null);
  },1000);
}
function drillStopTimer(){ if(TRAIN.drill&&TRAIN.drill.timer){ clearInterval(TRAIN.drill.timer); TRAIN.drill.timer=null; } }
function drillAnswer(act){
  const D=TRAIN.drill; if(!D||!D.q||D.answered) return;
  D.answered=true; drillStopTimer();
  const ok=act?ruleAccepts(D.q.rule,act):false;
  D.ans.push({type:D.q.type,ok:ok,act:act,lesson:D.q.rule.lesson});
  accRecord(D.q.rule.lesson,'drill',ok);
  if(!ok&&D.q.rule.lesson) leakAdd(D.q.rule.lesson);
  D.lastAct=act; D.lastOk=ok;
  renderTrain();
}

      (q.type==='post'?'<br>胜率约 '+pctTxt(q.eq)+'（对 '+q.villain.name+' 可能的牌），跟注需要 '+pctTxt(q.po)+' · 你是'+TIER_CN[q.cls.tier]:'')+
      (q.type!=='post'?'<br>'+handKey(q.hole)+' 属于「'+PF_CLASS[r.pc][0]+'」'+(r.why?'：'+r.why:''):'')+
      (LESSON[r.lesson]?'<br><span class="dim">下次记住：'+LESSON[r.lesson]+'</span>':'')+
      '</div><button class="mbtn solid" id="drNext" style="margin-top:10px">'+(D.i>=DRILL_N?'看成绩':'下一题')+'</button>';
  }
  return '<div class="drhead"><span>第 '+D.i+' / '+DRILL_N+' 题 · '+(DRILL_TOPICS.find(function(t){return t[0]===D.topic;})||['', '针对练习'])[1]+

/* ---------- 3. 正确率 ---------- */
function accHTML(){
  const a=accLoad();
  const keys=Object.keys(a.cats).filter(function(k){ return LESSON_TITLE[k]; });
  if(!keys.length) return '<div class="lobbynote">还没有数据。打几手牌（每个决定都会自动记）或做一组专项练习，这里就会出现每类局面的正确率。</div>';
  keys.sort(function(x,y){
    const px=accPct(a.cats[x].real), py=accPct(a.cats[y].real);
    return (px==null?101:px)-(py==null?101:py);
  });
  const bar=function(p){ return p==null?'<span class="dim">—</span>':'<span class="bar"><i style="width:'+p+'%" class="'+(p>=80?'up':p>=60?'mid':'down')+'"></i></span>'+p+'%'; };
  const days=a.days.slice(-14);
  const trend=days.length?'<div class="trend">'+days.map(function(d){
    const pr=accPct(d.real), pd=accPct(d.drill);
    return '<div class="tday" title="'+d.d+'"><div class="tcol"><i class="real" style="height:'+(pr||0)+'%"></i><i class="drill" style="height:'+(pd||0)+'%"></i></div><small>'+d.d.slice(5)+'</small></div>';
  }).join('')+'</div><div class="legend"><span><i class="call"></i>实战正确率</span><span><i class="raise"></i>练习正确率</span></div>':'';
  return '<div class="lobbynote" style="margin:0 0 8px">按实战正确率从低到高排：最上面的就是最该练的。接近的决定两种打法都算对。</div>'+
    '<table class="rk acc"><thead><tr><th>局面</th><th>实战</th><th>练习</th><th></th></tr></thead><tbody>'+

/* ---------- 4. 手牌回放 ---------- */
function replaySteps(h){
  const steps=[{k:'start'}];
  let st=0, mine=0;
  h.hist.forEach(function(e){
    if(e.st>st){ for(let s2=st+1;s2<=e.st;s2++) steps.push({k:'deal',st:s2}); st=e.st; }
    const step={k:'act',e:e};
    if(e.id===h.meId&&e.t!=='sb'&&e.t!=='bb'){ step.dec=h.dec[mine]||null; mine++; }
    steps.push(step);
  });
  const bd=h.board.length;
  const lastSt=bd>=5?3:bd>=4?2:bd>=3?1:0;
  for(let s2=st+1;s2<=lastSt;s2++) steps.push({k:'deal',st:s2});
  steps.push({k:'end'});
  return steps;
}

    const onlyBad=!!(R&&R.onlyBad);
    const rows=list.filter(function(x){ return !onlyBad||x.dec.some(function(d){ return d.grade==='bad'; }); });
    return '<label class="tog" style="border:none;padding:0 0 8px"><input type="checkbox" id="rpBad"'+(onlyBad?' checked':'')+'><span><b>只看有失误的手</b></span></label>'+

      }).join('')+'</div>';
  }
  const h=R.hand, steps=replaySteps(h), i=Math.max(0,Math.min(R.i,steps.length-1)), cur=steps[i];
  let st=0, pot=0;
  for(let k=0;k<=i;k++){ const s2=steps[k]; if(s2.k==='deal') st=s2.st; if(s2.k==='act'){ pot=s2.e.pot+s2.e.add; } }
  const nm=function(id){ const p=h.players.find(function(x){ return x.id===id; }); return p?(id===h.meId?'你':p.name):id; };
  const verb=function(e){ return {sb:'下小盲 '+e.to,bb:'下大盲 '+e.to,fold:'弃牌',check:'过牌',call:'跟注 '+e.add,bet:'下注 '+e.to,raise:'加注到 '+e.to,allin:'全下 '+e.to}[e.t]||e.t; };
  const shown=st===0?[]:h.board.slice(0,st+2);
  const lines=steps.slice(0,i+1).filter(function(s2){ return s2.k!=='start'; }).map(function(s2,idx,arr){
    const last=idx===arr.length-1;
    if(s2.k==='deal') return '<div class="rpl deal'+(last?' cur':'')+'">'+STREET_NAMES[s2.st][1]+'：'+h.board.slice(0,s2.st+2).map(cardText).join(' ')+'</div>';
    if(s2.k==='end') return '<div class="rpl end'+(last?' cur':'')+'">结束：你 '+sgn(h.net)+
      (h.players.some(function(p){ return p.shown; })?' · 亮牌：'+h.players.filter(function(p){ return p.shown; }).map(function(p){ return p.name+' '+p.shown.map(cardText).join(' '); }).join('，'):'')+'</div>';
    const g=s2.dec&&s2.dec.grade;
    return '<div class="rpl'+(s2.e.id===h.meId?' me':'')+(last?' cur':'')+'">'+esc(nm(s2.e.id))+' '+verb(s2.e)+(g==='bad'?' <span class="down">✗</span>':g==='good'?' <span class="up">✓</span>':'')+'</div>';
  });
  let decBox='';

      (d.need?'，跟注需要 '+pctTxt(d.potOdds):'')+'<br>教练建议：<b>'+esc(d.advLabel||'')+'</b>'+(d.close?'（接近的决定）':'')+
      (d.note?'<br>'+esc(d.note):'')+(d.lesson&&LESSON[d.lesson]&&d.grade!=='good'?'<br><span class="dim">下次记住：'+LESSON[d.lesson]+'</span>':'')+'</div>';
  }
  return '<div class="rptop"><div><small>你的牌</small><div class="mini">'+cardsHTML(h.hole)+'</div></div>'+

      '<div><small>底池</small><b class="num">'+fmt(pot)+'</b></div></div>'+
    '<div class="rplines">'+lines.join('')+'</div>'+decBox+
    '<div class="rpctl"><button class="mbtn" id="rpBack">← 列表</button><button class="mbtn" id="rpPrev"'+(i<=0?' disabled':'')+'>上一步</button>'+
      '<button class="mbtn solid" id="rpNext"'+(i>=steps.length-1?' disabled':'')+'>下一步</button><button class="mbtn" id="rpBadNext">跳到下个失误</button>'+
      (aiReady('coach')?'<button class="mbtn" id="rpAI">让 AI 讲这手</button>':'')+'</div>'+
    '<div class="aitext" id="rpAIText" style="display:none"></div>';
}

/* ============================================================
   12. 联机（房主权威 · HTTP 长轮询）
   谁开房谁当庄：房主浏览器跑全部牌局逻辑，每个「画面」按玩家视角
   裁一遍（别人的底牌不下发），客户端只画不判。
   ============================================================ */
const NICK_KEY='mh_nick', SRV_KEY='mh_server', SESS_KEY='mh_session';
const NET={
  online:false, pid:null, token:null, roomId:null, isHost:false, hostOwns:false,
  nick:'', server:'', version:0, hostPid:null, members:[], started:false,
  lan:[], port:null, seatSig:null,
  err:'', busy:false, view:null, gameSeq:0, logN:0,
  seen:new Set(), seenQ:[], waiting:null, turnStartAt:0, turnMs:30000,
  viewSeq:0, pushTimer:null, pushTail:0, waitLeft:null,
  banner:{t:'',n:0}, bannerSeq:0, resultSeq:0, results:{},
  lastBannerN:0, lastResultN:0, polling:false
};
const nsleep=function(ms){ return new Promise(function(r){ setTimeout(r,ms); }); };
function enc(s){ return encodeURIComponent(String(s==null?'':s)); }

/* ---------- 小工具：请求 / 提示 ---------- */
async function api(pathname,body,ms){
  const ctl=new AbortController();
  const t=setTimeout(function(){ ctl.abort(); },ms||15000);
  try{
    const r=await fetch(NET.server+pathname,{
      method:body===undefined?'GET':'POST',
      headers:body===undefined?undefined:{'Content-Type':'application/json'},
      body:body===undefined?undefined:JSON.stringify(body),
      signal:ctl.signal,cache:'no-store'
    });
    const data=await r.json().catch(function(){ return {}; });
    return {ok:r.ok,status:r.status,data:data};
  }catch(e){
    return {ok:false,status:0,data:{},err:(e&&e.name==='AbortError')?'timeout':'network'};
  }finally{ clearTimeout(t); }
}
let toastT=null;
function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ el.classList.remove('show'); },2600);
}
/* 自带部署好的中继：App（file:// 打开）默认连它，点一下就能和外地朋友开局。
   想在自己电脑上开桌（局域网 / 不联网）就在大厅的进阶里改成 http://localhost:3000 */
const PUBLIC_RELAY='https://midnight-holdem.app.workbuddy.host';
function defaultServer(){
  if(location.protocol==='http:'||location.protocol==='https:') return location.origin;
  try{ return localStorage.getItem(SRV_KEY)||PUBLIC_RELAY; }catch(e){ return PUBLIC_RELAY; }
}
function normServer(s){
  s=String(s||'').trim().replace(/\/+$/,'');
  if(!s) s=defaultServer();
  if(!/^https?:\/\//i.test(s)) s='http://'+s;
  return s;
}
function saveSession(){
  try{ localStorage.setItem(SESS_KEY,JSON.stringify({pid:NET.pid,token:NET.token,roomId:NET.roomId,nick:NET.nick,server:NET.server})); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){ return null; }
}
function saveNick(n){ try{ localStorage.setItem(NICK_KEY,n); }catch(e){} }
function loadNick(){ try{ return localStorage.getItem(NICK_KEY)||''; }catch(e){ return ''; } }
function inviteBase(){
  /* 页面是从服务器打开的就用当前地址；本机开 app / 本地文件时，
     房主给朋友的链接必须换成局域网 IP，否则对方连的是他自己那台机器。 */
  const local=/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/i;
  let host='';
  try{ host=location.hostname; }catch(e){}
  const fromServer=location.protocol==='http:'||location.protocol==='https:';
  if(fromServer&&!local.test(host)) return location.origin.replace(/\/+$/,'');
  const port=(NET.port||3000);
  const lan=NET.lan&&NET.lan.length?NET.lan[0].ip:'';
  if(fromServer&&lan) return 'http://'+lan+':'+port;
  if(fromServer) return location.origin.replace(/\/+$/,'');
  if(lan) return 'http://'+lan+':'+port;
  return NET.server||defaultServer();
}
function inviteLink(){ return inviteBase()+'/?room='+NET.roomId; }

/* ---------- 房主 → 中继：各家视角快照 ---------- */
function makeView(pid){
  const wait=NET.waiting||null;
  const cc=function(c){ return {r:c.r,s:c.s}; };
  return {
    v:++NET.viewSeq,
    seq:NET.gameSeq,
    started:NET.started,
    phase:G.phase, handNo:G.handNo, street:G.street,
    sb:G.sb, bb:G.bb, pot:G.pot, currentBet:G.currentBet, minRaise:G.minRaise,
    button:G.button, actor:G.actor, sbId:G.sbId, bbId:G.bbId,
    board:G.board.map(cc),
    winners:G.winnerIds.slice(),
    players:G.players.map(function(p){
      return {
        id:p.id, pid:p.pid||null, name:p.name, av:p.av, tag:p.tag,
        isMe:p.pid===pid, isHuman:!!p.isHuman, isAI:!!p.isAI,
        stack:p.stack, streetBet:p.streetBet, committed:p.committed,
        folded:!!p.folded, allIn:!!p.allIn, out:!!p.out, left:!!p.left,
        reveal:!!p.reveal, lastAction:p.lastAction||'',
        /* 关键：只有自己的牌、和已经摊开的牌才下发 */
        hole:(p.pid===pid||p.reveal)?p.hole.map(cc):null,
        holeCount:p.hole.length, buyins:p.buyins||1, hands:(p.st&&p.st.hands)||0,
        /* 牌桌上看得见的东西：台词、在不在想、是不是上头了 */
        say:p.sayText||'', sayN:p.sayN||0, think:p.thinking||0, tilt:p.tilt>0?1:0,
        lt:p.lastThink||0, lts:p.lastThinkSt==null?-1:p.lastThinkSt, lth:p.lastThinkHand||0
      };
    }),
    /* 本手公开的行动记录（大家都看得见），客户端的教练靠它读牌 */
    hist:(G.hist||[]).slice(-48).map(function(h){
      return {st:h.st,id:h.id,name:h.name,t:h.t,to:h.to,add:h.add,need:h.need,pot:h.pot,rno:h.rno,raise:h.raise};
    }),
    waiting:!!(G.phase==='betting'&&G.players[G.actor]&&G.players[G.actor].pid===pid),
    /* 有人在被等的时候，所有人都收到剩余秒数（谁在等由 waiting 判断） */
    waitLeft:wait?Math.max(0,Math.ceil((wait.deadline-Date.now())/1000)):null,
    turnMs:Math.round(NET.turnMs/1000),
    log:LOG_BUF.slice(-46),
    banner:NET.banner,
    result:NET.results[pid]||null
  };
}
function pushViews(){
  if(!NET.online||!NET.isHost||!NET.pid) return;
  const views={};
  for(const p of G.players){
    if(p.isHuman&&p.pid) views[p.pid]=makeView(p.pid);
  }
  NET.pushTail=Date.now();
  api('/api/room/'+NET.roomId+'/views',{
    pid:NET.pid, token:NET.token, views:views, started:NET.started
  },12000).then(function(r){
    if(!r.ok&&NET.online) NET.err=netErrText(r);
  });
}
/* 一次 render 里可能连改好几处状态，合并成一次推送 */
function schedulePush(){
  if(!NET.online||!NET.isHost) return;
  if(NET.pushTimer) return;
  NET.pushTimer=setTimeout(function(){ NET.pushTimer=null; pushViews(); },60);
}
/* 房主自己也要定期把「还在等谁」刷给客户端，倒计时才走得动 */
function startHostTicker(){
  if(NET._tick) return;
  NET._tick=setInterval(function(){
    if(!NET.online||!NET.isHost) return;
    if(NET.waiting) pushViews();
  },2000);
}

/* ---------- 中继 → 客户端：状态与视角 ---------- */
function netErrText(r){
  const e=r&&r.data&&r.data.error;
  if(r.status===0&&r.err==='timeout') return '连接超时，检查一下服务器地址';
  if(r.status===0) return '连不上服务器，检查网络或服务器地址';
  if(e==='room_not_found') return '找不到这个房间，房号对吗？';
  if(e==='room_full') return '房间满了（最多 4 人）';
  if(e==='already_started') return '这局已经开始了，等他们打完再来';
  if(e==='bad_auth') return '登录状态失效，请重新加入';
  if(e==='not_host') return '只有房主能做这个操作';
  return '操作没成功，稍后再试';
}
function applyState(st){
  if(!st) return;
  if(st.gone){ netFatal('房间已过期'); return; }
  if(st.version) NET.version=st.version;
  NET.members=st.members||[];
  NET.hostPid=st.hostPid||null;
  if(st.lan) NET.lan=st.lan;
  if(st.port) NET.port=st.port;
  const wasStarted=NET.started;
  NET.started=!!st.started;
  /* 房主一开局就把大厅收掉，客人的屏幕直接切到牌桌 */
  if(NET.started&&!wasStarted&&lobbyOpen&&!NET.isHost){
    closeLobby();
    toast('牌局开始了');
  }
  const meSt=NET.members.find(function(m){ return m.pid===NET.pid; });
  if(!meSt){ netFatal('你已经不在这个房间里了'); return; }
  if(meSt.nick&&meSt.nick!==NET.nick){ NET.nick=meSt.nick; saveNick(NET.nick); }
  if(NET.hostPid===NET.pid&&!NET.isHost){
    NET.isHost=true; NET.hostOwns=false; startHostTicker();
    renderLobby();
  }
  if(NET.isHost&&st.actions) hostIngest(st.actions);
  else if(!NET.isHost&&st.view) applyView(st.view);
  else renderLobby();
  if(NET.isHost) renderLobby();
}
/* 客户端：把视角快照套进 G，然后照常用同一套渲染 */
function applyView(view){
  if(!view) return;
  NET.view=view;
  if(view.seq!==NET.gameSeq){
    NET.gameSeq=view.seq;
    NET.logN=0;
    document.getElementById('log').innerHTML='';
  }
  NET.started=!!view.started;
  G.phase=view.phase; G.handNo=view.handNo; G.street=view.street;
  G.sb=view.sb; G.bb=view.bb; G.pot=view.pot;
  G.currentBet=view.currentBet; G.minRaise=view.minRaise;
  G.button=view.button; G.actor=view.actor; G.sbId=view.sbId; G.bbId=view.bbId;
  G.board=(view.board||[]).map(function(c){ return {r:c.r,s:c.s}; });
  G.winnerIds=(view.winners||[]).slice();
  G.waiting=!!view.waiting;
  NET.waitLeft=(view.waitLeft==null?null:view.waitLeft);
  NET.turnMs=(view.turnMs||30)*1000;
  /* 先把阵容换掉，再决定要不要重建座位 —— 顺序反了的话，
     buildTable() 会照着上一局的旧数组刻名字，座位上就会一直挂着错的人名 */
  G.players=(view.players||[]).map(function(v){
    return {
      id:v.id, pid:v.pid, name:v.name, av:v.av, tag:v.tag,
      isMe:!!v.isMe, isHuman:!!v.isHuman, isAI:!!v.isAI,
      stack:v.stack,
      /* 别人的底牌只有张数、没有点数：画成牌背，看不出是什么 */
      hole:(v.hole&&v.hole.length)
        ? v.hole.map(function(c){ return {r:c.r,s:c.s}; })
        : new Array(v.holeCount||0).fill(null),
      streetBet:v.streetBet, committed:v.committed||0,
      folded:!!v.folded, allIn:!!v.allIn, acted:false, out:!!v.out, left:!!v.left,
      reveal:!!v.reveal, lastAction:v.lastAction||'',
      sayText:v.say||'', sayN:v.sayN||0, thinking:v.think||0, tilt:v.tilt?1:0,
      lastThink:v.lt||0, lastThinkSt:v.lts, lastThinkHand:v.lth||0,
      persona:v.isAI?personaById(v.id):null, buyins:v.buyins||1, st:Object.assign(newStats(),{hands:v.hands||0})
    };
  });
  G.hist=Array.isArray(view.hist)?view.hist:[];
  const wasPhase=NET.lastPhase;
  NET.lastPhase=G.phase;
  if(G.phase==='over'&&wasPhase&&wasPhase!=='over') coachHandEnd();
  else if(G.phase!=='over'&&G.handNo!==NET.lastHandNo){ NET.lastHandNo=G.handNo; coachHandStart(); }
  /* 人名/身份变了就整桌重建，否则只更新数值 */
  const seatSig=G.players.map(function(p){ return p.id+'|'+p.name+'|'+(p.isMe?'me':''); }).join('·');
  if(seatSig!==NET.seatSig||seatEls.length!==G.players.length){
    NET.seatSig=seatSig;
    buildTable();
  }
  render();
  applyLog(view.log);
  if(view.banner&&view.banner.n&&view.banner.n!==NET.lastBannerN){
    NET.lastBannerN=view.banner.n;
    bannerShow(view.banner.t);
  }
  if(view.result){
    if(view.result.n!==NET.lastResultN){ NET.lastResultN=view.result.n; }
    showResult(view.result.t,view.result.v);
  }else{
    hideResult();
  }
  if(NET.lobbyOpen) renderLobby();
}
function applyLog(items){
  if(!items||!items.length) return;
  const fresh=items.filter(function(it){ return it.n>NET.logN; });
  if(!fresh.length) return;
  NET.logN=fresh[fresh.length-1].n;
  logPaint(fresh);
}

/* ---------- 长轮询 ---------- */
async function pollLoop(){
  if(NET.polling) return;
  NET.polling=true;
  while(NET.online&&NET.polling){
    let q='?pid='+enc(NET.pid)+'&token='+enc(NET.token)+'&since='+NET.version;
    if(NET.isHost){
      q+='&as=host';
      if(hostAck.length) q+='&ack='+hostAck.splice(0,hostAck.length).map(enc).join(',');
    }
    const r=await api('/api/room/'+NET.roomId+'/state'+q,undefined,34000);
    if(!NET.online||!NET.polling) break;
    if(!r.ok){
      if(r.status===404){ netFatal('房间已关闭'); break; }
      if(r.status===403){ netFatal('登录状态失效，请重新加入'); break; }
      NET.err=netErrText(r);
      renderLobby();
      await nsleep(1500);
      continue;
    }
    NET.err='';
    applyState(r.data);
  }
  NET.polling=false;
}

/* ---------- 进入 / 离开房间 ---------- */
function netEnter(d){
  NET.pid=d.pid; NET.token=d.token; NET.roomId=d.roomId;
  NET.isHost=!!d.host; NET.hostOwns=!!d.host;
  NET.nick=d.nick||NET.nick;
  NET.online=true; NET.version=0; NET.err='';
  if(d.lan) NET.lan=d.lan;
  if(d.port) NET.port=d.port;
  NET.seen=new Set(); NET.seenQ=[]; remoteQ=[]; hostAck=[];
  NET.seatSig=null;
  /* 进房可能是在单机牌局打到一半时发生的：先把本地那局掐掉，免得两个循环抢桌子 */
  if(G.busy){ G.token++; G.busy=false; }
  G.pending=null; G.waiting=false;
  if(!NET.isHost) G.phase='idle';
  saveNick(NET.nick); saveSession();
  closeLobbyOverlayIfIdle();
  renderLobby();
  pollLoop();
  if(NET.isHost) startHostTicker();
  setTimeout(function(){ if(NET.online) pollLoop(); },1000);
}
async function netCreate(){
  if(NET.busy) return;
  const nick=lobbyNickVal();
  if(!nick){ lobbyErr('先取个昵称，朋友才知道谁是谁'); return; }
  NET.server=normServer(lobbySrvVal());
  NET.nick=nick; NET.busy=true; lobbyErr('正在建房…',true);
  const r=await api('/api/create',{nick:nick},12000);
  NET.busy=false;
  if(!r.ok){ lobbyErr(netErrText(r)); return; }
  /* 只有真连上了才记住这个地址，否则下次开桌会一直拿一个连不上的地址去试 */
  try{ localStorage.setItem(SRV_KEY,NET.server); }catch(e){}
  netEnter(r.data);
  toast('房间已建好：'+r.data.roomId);
}
async function netJoin(roomId){
  if(NET.busy) return;
  const nick=lobbyNickVal();
  if(!nick){ lobbyErr('先取个昵称，朋友才知道谁是谁'); return; }
  const code=String(roomId||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4){ lobbyErr('房号是 5 位字母数字，问一下房主'); return; }
  NET.server=normServer(lobbySrvVal());
  NET.nick=nick; NET.busy=true; lobbyErr('正在加入 '+code+'…',true);
  const sess=loadSession();
  const body={roomId:code,nick:nick};
  if(sess&&sess.roomId===code&&sess.pid&&sess.token){ body.pid=sess.pid; body.token=sess.token; }
  const r=await api('/api/join',body,12000);
  NET.busy=false;
  if(!r.ok){ lobbyErr(netErrText(r)); return; }
  try{ localStorage.setItem(SRV_KEY,NET.server); }catch(e){}
  netEnter(r.data);
  toast(r.data.rejoin?'已回到原座位':'加入成功');
}
/* 把服务器地址清回默认（线上桌） */
function resetServer(){
  try{ localStorage.removeItem(SRV_KEY); }catch(e){}

function netSend(type,amount){
  if(!NET.online) return;
  const me=human();
  if(!me) return;
  api('/api/room/'+NET.roomId+'/action',{
    pid:NET.pid,token:NET.token,action:{type:type,amount:amount||0}
  },10000).then(function(r){
    if(!r.ok) toast(netErrText(r));
  });
  /* 乐观上锁：等房主把新视角推回来之前，先别让人连点 */

async function netLeave(silent){
  if(!NET.online) return;
  const body={pid:NET.pid,token:NET.token};
  NET.polling=false;
  NET.online=false;
  if(NET._tick){ clearInterval(NET._tick); NET._tick=null; }
  await api('/api/room/'+NET.roomId+'/leave',body,8000).catch(function(){});
  if(!silent) toast('已离开房间');
  const wasHost=NET.isHost;
  NET.isHost=false; NET.hostOwns=false; NET.roomId=null; NET.pid=null; NET.token=null;
  NET.members=[]; NET.started=false; NET.waiting=null; NET.waitLeft=null;
  clearSession();

  if(!silent&&wasHost){
    log('<small>联机</small>你已离开房间，牌局交给下一位房主。','tip');
  }
  goSolo();

/* 房间出问题：退回单机，别把界面卡在半死不活的状态 */
function netFatal(msg){
  toast(msg||'联机中断');
  NET.err=msg||'联机中断';
  NET.polling=false;
  NET.online=false;
  if(NET._tick){ clearInterval(NET._tick); NET._tick=null; }

  NET.pid=null; NET.token=null; NET.roomId=null; NET.members=[]; NET.started=false;

function copyText(t){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){ toast('复制失败，手动选一下吧'); });
  }else{
    const ta=document.createElement('textarea');
    ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，手动选一下吧'); }
    document.body.removeChild(ta);
  }
}

    try{ return new URLSearchParams(location.search||'').get('room'); }catch(e){ return null; }
  })();
  if(invite){
    const code=String(invite).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    setTimeout(function(){
      openLobby();
      renderLobby();
      const c=document.getElementById('lkCode');
      if(c) c.value=code;
      const n=document.getElementById('lkNick');
      if(n&&!n.value) n.focus();
      toast('房号 '+code+' 已填好，取个昵称就能进');
    },120);
  }else{
    /* 首启引导 */
    openTutorial(0);
  }
}
boot();
</script>
</body>
</html>
