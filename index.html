/* 非 4 人桌：对手沿椭圆从右下（下家）逆时针排到左下；按屏幕形态换一套参数，再按座位实际宽高夹在桌面内 */
function seatMode(){
  if(typeof matchMedia!=='function') return 'd';
  if(matchMedia('(max-width:900px) and (orientation:landscape) and (max-height:560px)').matches) return 'l';
  return matchMedia('(max-width:900px)').matches?'p':'d';
}
const SEAT_GEO={d:{cx:50,cy:51,rx:46,ry:41,a0:-22,a1:202},p:{cx:50,cy:35,rx:40,ry:31,a0:-14,a1:194},l:{cx:50,cy:44,rx:44,ry:38,a0:-12,a1:192}};
function positionSeats(){
  const n=G.players.length, tb=document.querySelector('.table');
  if(!tb||!seatEls.length) return;
  const meIdx=Math.max(0,G.players.findIndex(function(p){ return p.isMe; }));
  const g=SEAT_GEO[seatMode()], m=n-1, tw=tb.clientWidth||1, th=tb.clientHeight||1;
  /* 横屏时牌桌比屏幕还宽：按「牌桌和屏幕重叠的那块」夹边，免得座位跑出屏幕 */
  const R=tb.getBoundingClientRect(), vw=(typeof innerWidth==='number'&&innerWidth)||R.right;
  const lo=Math.max(0,-R.left)/tw*100, hi=100-Math.max(0,R.right-vw)/tw*100;
  for(let k=1;k<=m;k++){
    const el=seatEls[(meIdx+k)%n];
    if(!el||!el.classList.contains('gen')) continue;
    let a0=g.a0, a1=g.a1;
    if(m===2){ a0=35; a1=145; }
    const a=(m===1?90:a0+(a1-a0)*(k-1)/(m-1))*Math.PI/180;
    let x=g.cx+g.rx*Math.cos(a), y=g.cy-g.ry*Math.sin(a);
    /* 量的时候可能还没发牌：横屏牌在铭牌旁边，要把两张牌的宽度先算进去 */
    const pl=el.querySelector('.plate'), mode=seatMode();
    const w=Math.max(el.offsetWidth,(pl?pl.offsetWidth:0)+(mode==='l'?60:0)), h=Math.max(el.offsetHeight,(pl?pl.offsetHeight:0)+(mode==='l'?0:mode==='p'?34:52));
    const hw=(w/2+4)/tw*100, hh=(h/2+2)/th*100;
    x=Math.max(lo+hw,Math.min(hi-hw,x)); y=Math.max(hh,Math.min(100-hh,y));
    el.style.left=x.toFixed(2)+'%'; el.style.top=y.toFixed(2)+'%';
    el.classList.toggle('gr',x>55);
  }
}

function renderSay(el,p){
  const say=el.querySelector('.say');

  if(p.sayN&&String(p.sayN)!==el.dataset.sayN){
    el.dataset.sayN=String(p.sayN);

    say.className='say show talk';

    clearTimeout(el._sayT);
    el._sayT=setTimeout(function(){ el._sayOn=false; say.classList.remove('show','talk'); },3400);
  }
  if(!el._sayOn){
    if(p.thinking&&!p.folded){
      const tank=p.thinking===2;
      const want='say show think'+(tank?' tank':'');
      if(say.className!==want){
        say.className=want;
        say.innerHTML=(tank?'长考中':'')+'<i></i><i></i><i></i>';
      }
    }else if(say.classList.contains('think')){
      say.className='say'; say.innerHTML='';
    }
  }

/* 压迫感：面对大注或全下时，桌边泛红、心跳声响起 */
let HEARTBEAT=null;
function updatePressure(){
  const me=human();
  let on=false;
  if(me&&G.waiting&&G.phase==='betting'&&!me.folded&&!gamePaused){
    const need=Math.max(0,G.currentBet-me.streetBet);
    on=need>0&&(need>=me.stack||need>=Math.max(G.bb*6,me.stack*0.22));
  }
  document.body.classList.toggle('pressure',on);
  if(on&&!HEARTBEAT){
    HEARTBEAT=setInterval(function(){
      if(gamePaused) return;
      tone(64,.16,'sine',.09); tone(58,.14,'sine',.07,.18);
    },960);
  }else if(!on&&HEARTBEAT){
    clearInterval(HEARTBEAT); HEARTBEAT=null;
  }
}

function renderTurnClock(){

function renderCards(p,host){
  const want=p.hole.length;
  /* 只有「我自己的牌」和摊牌翻开的牌才亮出来；联机时别人的底牌根本没下发到本机 */
  const reveal=p.isMe||p.reveal;
  /* 节点数变少（新一手开始发牌）时整批重建，避免残留上一手的旧牌 */
  if(host.children.length>want) host.innerHTML='';
  /* 补建节点 */
  while(host.children.length<want){
    const i=host.children.length;
    const c=p.hole[i];
    const el=cardEl(reveal?c:null,!reveal,i);
    el.classList.add('deal');
    host.appendChild(el);
  }
  /* 翻开 */
  for(let i=0;i<want;i++){
    const el=host.children[i], c=p.hole[i];
    if(!c) continue;
    if(reveal){
      if(el.classList.contains('down')){
        el.classList.remove('down');
        el.dataset.suit=c.s;
        el.classList.toggle('wide',RANK_LABEL[c.r].length>1);
        el.innerHTML='<span class="r">'+RANK_LABEL[c.r]+'</span><span class="s">'+SUIT_GLYPH[c.s]+'</span><span class="big">'+SUIT_GLYPH[c.s]+'</span>';
        el.classList.add('flip');
      }
    }else if(!el.classList.contains('down')){
      el.classList.add('down'); el.innerHTML='';
    }
  }
}

function renderMine(){
  const me=human();
  const host=document.getElementById('myCards');
  const hole=me?me.hole:[];

  /* 增量更新：只有底牌真正变化时才动 DOM，新增的牌才播入场动画。
     否则每次行动/每条街的重渲染都会重播 dealIn，牌就会乱跳。 */
  const sig=hole.length?hole.map(function(c){return c.r+'-'+c.s;}).join('|'):'empty';
  const prev=host.dataset.sig||'';
  if(sig!==prev){
    host.dataset.sig=sig;
    const prevKeys=prev&&prev!=='empty'?prev.split('|'):[];
    const pureAppend=prevKeys.length>0&&hole.length>prevKeys.length&&
      prevKeys.every(function(k,i){ return hole[i]&&k===(hole[i].r+'-'+hole[i].s); });
    if(!pureAppend) host.innerHTML='';
    if(!hole.length){
      while(host.children.length<2) host.appendChild(emptyCard());
    }else{
      hole.forEach(function(c,i){
        if(host.children[i]) return;          /* 已有的牌原地不动，不重播动画 */
        const el=cardEl(c,false,i);
        el.classList.add('deal');
        host.appendChild(el);
      });
    }
  }
  if(!me||hole.length===0){
    document.getElementById('myHandLabel').textContent='—';
    document.getElementById('myStars').textContent='';
    return;
  }
  if(G.board.length>=3&&!me.folded){
    document.getElementById('myHandLabel').textContent=describeHand(me.hole.concat(G.board));
    document.getElementById('myStars').textContent=stars(me.hole.concat(G.board));
  }else if(me.hole.length===2){
    document.getElementById('myHandLabel').textContent=preflopLabel(me.hole);
    document.getElementById('myStars').textContent='';
  }
}
function stars(cards){
  const e=evaluate(cards);
  const n=e.cat;
  return '\u2605'.repeat(n+1)+'\u2606'.repeat(9-n-1);
}
function preflopLabel(hole){
  const a=Math.max(hole[0].r,hole[1].r), b=Math.min(hole[0].r,hole[1].r);
  if(a===b) return '口袋对子 Pair of '+RANK_LABEL[a];
  if(hole[0].s===hole[1].s) return RANK_LABEL[a]+RANK_LABEL[b]+' 同花 suited';
  return RANK_LABEL[a]+RANK_LABEL[b]+' 不同花 offsuit';
}

/* ---------- 教练面板 ----------
   本地教练：按「对手可能的牌」算胜率，给出明确建议 + 理由 + 对手解读，措辞每次不同。
   AI 教练（DeepSeek）：在本地分析的基础上，用自己的话组织建议、每手复盘。
   注意：教练说的话里有你的底牌，只画在本机，绝不进联机广播的日志。 */
const COACH={sig:'',a:null,hand:null,aiSig:'',aiFailSig:'',aiCtl:null,aiBusy:false,leaks:null};

const LEAK_STORE='mh_leaks';
function leaksLoad(){
  if(COACH.leaks) return COACH.leaks;

function leakAdd(key){

}
function leakTop(n){
  const L=leaksLoad();

    .sort(function(a,b){ return L[b]-L[a]; }).slice(0,n)

}

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function coachAnalysis(me){
  const need=Math.max(0,G.currentBet-me.streetBet);
  const opps=G.players.filter(function(p){ return p!==me&&!p.folded&&!p.out&&!p.left; });
  const sig=[G.handNo,G.street,G.board.length,me.hole.map(cid).join(''),need,G.pot,
    opps.map(function(o){return o.id;}).join(','),(G.hist||[]).length,G.coach?1:0].join('|');
  if(sig===COACH.sig&&COACH.a) return COACH.a;
  const cls=classifyHand(me.hole,G.board);
  const eq=opps.length?rangeEquity(me.hole,G.board,opps.map(oppModel),G.coach?520:280):1;
  const order=postflopOrder().filter(function(q){ return !q.allIn||q===me; });
  const a={sig:sig,need:need,potOdds:need>0?need/(G.pot+need):0,eq:eq,cls:cls,opps:opps,
    inPos:order.length>0&&order[order.length-1]===me,bettor:need>0?lastAggOnStreet():null,
    spr:G.pot>0?me.stack/G.pot:99,tex:boardTexture(G.board),isPfAgg:G.pfAggId===me.id||
      (G.hist||[]).filter(function(h){return h.st===0&&h.raise;}).slice(-1).some(function(h){return h.id===me.id;})};
  a.adv=coachAdvise(me,a);
  a.read=coachRead(me,a);
  COACH.sig=sig; COACH.a=a;
  return a;
}
/* 起手牌按「打法类型」分类：教练按类型讲道理，比单看一个百分位好记 */
function pfClass(hole){
  const a=Math.max(hole[0].r,hole[1].r), b=Math.min(hole[0].r,hole[1].r), s=hole[0].s===hole[1].s;
  if(a===b) return a>=12?'premium':a>=10?'strong':'pair';
  if(a===14&&b===13) return 'premium';
  if((a===14&&b===12)||(a===14&&b===11&&s)||(a===13&&b===12&&s)) return 'strong';
  if(s&&a===14) return 'suitedAce';
  if(b>=10) return s?'suitedBroadway':'broadway';
  if(s&&a-b<=2&&b>=4) return 'suitedConn';
  if(a>=12) return 'dominated';
  return 'trash';
}

  post_call_odds:'面对下注先算账：需要的胜率 = 跟注额 ÷（底池 + 跟注额）。胜率比它高就跟。',
  post_fold_odds:'胜率低于需要的胜率就弃——为了「看看对手有什么」付钱是最贵的学费。',
  post_bluffcatch:'面对爱诈唬的对手，中等牌可以多抓；面对很少诈唬的对手，同样的牌要果断弃。',
  post_allin:'面对全下：胜率高于需要的胜率就跟，否则弃。别让「已经投了很多」影响判断。'
};
/* 翻前规则：教练、范围表、专项练习共用这一份，保证三处说法一致。
   sc = {spot:'open'|'bbOption'|'vsRaise'|'vs3bet', late, isSB, isBB, inPos, cheap, raiseBB, cheap3} */
function pfRule(hole,sc){
  const pc=pfClass(hole), pct=pfPct(hole);
  const R=function(act,lesson,close,why){ return {act:act,lesson:lesson,close:!!close,why:why||'',pc:pc,pct:pct}; };
  if(sc.spot==='bbOption'){
    if(pc==='premium'||pc==='strong') return R('raise','pf_iso',false,'前面只有人平跟，好牌要主动把底池做大');
    return R('check','pf_bb_check',false,'免费看翻牌，不用多花一分钱');
  }
  if(sc.spot==='open'){
    const th=sc.late?0.62:sc.isSB?0.7:0.78;
    if(pct>=th) return R('raise',sc.late&&pct<0.78?'pf_steal':'pf_open_raise',false,
      sc.late?'你在庄位，后面只剩两个盲注':'主动加注比平跟强：要么直接拿下盲注，要么带着主动权进翻牌');
    if(sc.isSB&&pct>=0.5) return R('call','pf_sb_complete',true,'只差半个大盲，价格便宜');
    return R('fold','pf_open_fold',false,'这种牌进池子大多是在送钱');
  }
  if(sc.spot==='vsRaise'){
    const suited=pc==='suitedAce'||pc==='suitedConn'||pc==='suitedBroadway';
    if(pc==='premium') return R('raise','pf_vs_raise_premium',false,'这是要打大底池的牌');
    if(pc==='strong') return R('call','pf_vs_raise_strong',sc.inPos,sc.inPos?'有位置，跟注看翻牌；想更凶也可以再加注':'牌够好，但还不到再加注的程度');
    if(pc==='pair') return sc.cheap?R('call','pf_vs_raise_pair',true,'跟注额不到你筹码的 1/15，中了三条能赢回很多')
      :R('fold','pf_vs_raise_pair',false,'跟注太贵：超过筹码的 1/15，中三条也赚不回来');
    if(suited) return sc.cheap&&(sc.inPos||sc.isBB)?R('call','pf_vs_raise_suited',true,(sc.isBB?'大盲已经投了钱':'有位置')+'，价格也便宜，可以看翻牌')
      :R('fold','pf_vs_raise_suited',true,!sc.cheap?'跟注太贵了':'没位置，翻后很难打');
    if(pc==='broadway') return (sc.isBB&&sc.raiseBB<=3)||(sc.inPos&&pct>=0.9)
      ?R('call','pf_vs_raise_broadway',true,sc.isBB?'大盲面对小额加注可以防守':'有位置，这手牌还算能打')
      :R('fold','pf_vs_raise_broadway',false,'');
    if(sc.isBB&&sc.raiseBB<=2.5&&pct>=0.55&&pc!=='dominated'&&pc!=='trash')
      return R('call','pf_bb_defend',true,'对手加得很小，你已经投了一个大盲，价格很便宜');
    return R('fold',pc==='dominated'?'pf_vs_raise_dominated':'pf_vs_raise_trash',false,'');
  }
  if(pct>=0.97) return R('raise','pf_vs_3bet',false,'面对三bet，这是少数能继续加注的牌');
  if(pct>=0.92&&sc.cheap3) return R('call','pf_vs_3bet',true,'够强可以跟，但别急着把筹码全推进去');
  return R('fold','pf_vs_3bet',false,'对手已经再加注，范围很窄');
}
/* 翻后面对下注（不是全下）的规则：教练和练习共用 */
function postRule(c,eq,po,street,bluffy){
  if(c.tier==='monster') return {act:'raise',lesson:'post_raise_monster',close:false,kind:'monster'};
  if(eq>=po+0.08) return {act:'call',lesson:c.tier==='draw'?'post_draw_odds':'post_call_odds',close:false,kind:'good'};
  if(eq>=po-0.03) return bluffy>=0.22?{act:'call',lesson:'post_bluffcatch',close:true,kind:'bluffcatch'}
    :{act:'call',lesson:'post_call_odds',close:true,kind:'thin'};
  if(c.tier==='draw'&&eq+0.06>=po&&street<3) return {act:'call',lesson:'post_draw_odds',close:true,kind:'draw'};
  return {act:'fold',lesson:bluffy<0.12?'post_bluffcatch':'post_fold_odds',close:eq>=po-0.06,kind:'fold'};
}
/* 某个答案算不算对：接近的决定，另一种合理打法也算对 */
function ruleAccepts(rule,act){
  if(act===rule.act) return true;
  if(!rule.close) return false;
  if(rule.lesson==='pf_vs_raise_strong') return act==='raise';
  if(rule.act==='fold') return act==='call';
  if(rule.act==='call') return act==='fold';
  if(rule.act==='raise') return act==='call'||act==='check';
  if(rule.act==='check') return act==='raise';
  return false;
}
function coachAdvise(me,a){
  const c=a.cls, eq=a.eq, need=a.need, bb=G.bb, pot=G.pot;
  const maxTo=me.streetBet+me.stack;
  const minTo=Math.min(maxTo,Math.max(G.currentBet+G.minRaise,G.bb));
  const snap=function(v){ const st=Math.max(1,G.sb); v=Math.round(v/st)*st; return Math.max(minTo,Math.min(maxTo,v)); };
  const H=hashStr(a.sig);
  const pv=function(arr){ return arr[H%arr.length]; };
  const R=[];
  const res=function(act,label,cls,to,more,lesson,close){
    return {act:act,label:label,cls:cls||'',to:to||0,R:R.concat(more||[]),
      lesson:lesson||'',lessonText:LESSON[lesson]||'',close:!!close};
  };
  if(G.street===0){
    const pc=pfClass(me.hole), info=PF_CLASS[pc];
    const pfR=(G.hist||[]).filter(function(h){ return h.st===0&&h.raise; }).length;
    const limpers=pfR===0?(G.hist||[]).filter(function(h){ return h.st===0&&h.t==='call'; }).length:0;
    const late=G.players.indexOf(me)===G.button;
    const isSB=me.id===G.sbId, isBB=me.id===G.bbId;
    R.push(handKey(me.hole)+' 属于「'+info[0]+'」'+info[1]);
    const shove=pfR>0&&need>=me.stack;
    if(shove){
      if(eq>=a.potOdds+0.02) return res('call','跟注全下','good',0,['胜率约 '+pctTxt(eq)+'，需要 '+pctTxt(a.potOdds)+'，够了'],'pf_vs_allin');
      return res('fold','弃牌','warn',0,['对手全下的范围很窄，你的胜率约 '+pctTxt(eq)+'，需要 '+pctTxt(a.potOdds)],'pf_vs_allin',eq>=a.potOdds-0.04);
    }
    const sc={spot:pfR===0?(need===0?'bbOption':'open'):(pfR===1?'vsRaise':'vs3bet'),late:late,isSB:isSB,isBB:isBB,inPos:a.inPos,
      cheap:need<=me.stack/15,raiseBB:G.currentBet/bb,cheap3:need<=me.stack*0.3};
    const r=pfRule(me.hole,sc);
    /* 翻前的「胜率」是假设免费看到河牌的胜率；没位置、踢脚弱的牌实际拿不到这么多 */
    const realize=pfR===0?[]:(eq>=a.potOdds?['看着胜率 '+pctTxt(eq)+' 比需要的 '+pctTxt(a.potOdds)+' 高，但这是「一路免费看到河牌」的胜率：'+
      (a.inPos?'':'你没位置、')+'后面几条街常被逼着放弃，真正拿到手的远没这么多']:['对上加注者的范围，你的胜率只有 '+pctTxt(eq)]);
    const why=r.why?[r.why]:[];
    if(r.act==='raise'){
      if(sc.spot==='bbOption') return res('raise','加注','good',snap((3.5+limpers)*bb),why,r.lesson,r.close);
      if(sc.spot==='open') return res('raise','加注','good',snap((2.5+limpers)*bb),why,r.lesson,r.close);
      if(sc.spot==='vsRaise') return res('raise','再加注（3-bet）','good',snap(G.currentBet*(a.inPos?3:3.6)),why,r.lesson,r.close);
      const allin=me.stack<=40*bb;
      return res('raise',allin?'全下':'再加注（4-bet）','good',allin?maxTo:snap(G.currentBet*2.4),why,r.lesson,r.close);
    }
    if(r.act==='check') return res('check','过牌','',0,why,r.lesson,r.close);
    if(r.act==='call'){
      const label={pf_vs_raise_pair:'跟注（赌三条）',pf_bb_defend:'跟注（大盲防守）',pf_sb_complete:'补齐小盲'}[r.lesson]||'跟注';
      return res('call',label,r.lesson==='pf_vs_raise_strong'?'good':'',0,why,r.lesson,r.close);
    }
    /* 价格 / 位置原因已经说清楚的就不再补「胜率」那句；其余弃牌都解释一下胜率为什么是虚的 */
    const priceWhy=r.lesson==='pf_vs_raise_pair'||r.lesson==='pf_vs_raise_suited';
    return res('fold','弃牌','warn',0,why.concat(priceWhy?[]:realize),r.lesson,r.close);
  }
  if(c.outs>0&&G.board.length<5){
    const pc=G.board.length===3?Math.min(100,c.outs*4-(c.outs>8?c.outs-8:0)):c.outs*2;
    R.push('补牌约 '+c.outs+' 张，'+(G.board.length===3?'到河牌':'下一张')+'中的机会约 '+pc+'%');
  }
  if(need===0){
    if(c.tier==='monster'){
      const f=a.tex.wet>0.5?0.75:0.6;
      return res('bet','下注 '+Math.round(f*100)+'% 底池','good',snap(pot*f),
        [pv(['你现在是'+TIER_CN[c.tier]+'，该收钱了','这牌别慢打，'+(a.tex.wet>0.5?'牌面很湿，':'')+'让对手付钱看牌'])],
        a.tex.wet>0.5?'post_value_wet':'post_value');
    }
    if(c.tier==='strong') return res('bet','下注一半底池','good',snap(pot*0.55),['强成牌：下注拿价值，也不让听牌免费追'],a.tex.wet>0.5?'post_value_wet':'post_value');
    if(c.tier==='draw'){
      if(a.inPos||a.isPfAgg) return res('bet','半诈唬下注','',snap(pot*0.55),['有听牌就有两条路赢：对手弃牌，或者你中牌'],'post_draw_semibluff',true);
      return res('check','过牌','',0,['没位置的听牌，过牌看免费的下一张更稳'],'post_draw_check',true);
    }
    if(c.tier==='medium') return res('check','过牌','',0,[pv(['中等牌力，控制底池更划算','这牌有摊牌价值，没必要把底池做大'])],'post_medium_control',true);
    if(a.isPfAgg&&G.street===1&&a.opps.length<=2&&a.tex.wet<0.5)
      return res('bet','小注持续下注（1/3 池）','',snap(pot*0.33),['你翻前加注过，干燥牌面小注经常就能拿下'],'post_cbet_dry',true);
    return res('check','过牌','',0,[pv(['没击中就别硬上，免费看下一张','空气牌，过牌把决定权交出去'])],'post_air_check');
  }
  R.unshift('胜率约 '+pctTxt(eq)+'（按对手可能的牌估算），跟注需要 '+pctTxt(a.potOdds));
  if(need>=me.stack){
    if(eq>=a.potOdds) return res('call','跟注全下','good',0,['赔率够，长期看这一跟是赚的'],'post_allin',eq<a.potOdds+0.05);
    return res('fold','弃牌','warn',0,['全下跟注要拿全部筹码去赌一个不够的胜率'],'post_allin',eq>=a.potOdds-0.05);
  }
  const bluffy=a.bettor?bluffTendency(a.bettor):0.15;
  const r=postRule(c,eq,a.potOdds,G.street,a.bettor?bluffy:0.15);
  if(r.kind==='monster') return res('raise','加注','good',snap(G.currentBet+(pot+need)*0.75),['你是'+TIER_CN[c.tier]+'，加注让对手付更多'],r.lesson);
  if(r.kind==='good') return res('call','跟注','good',0,[],r.lesson);
  if(r.kind==='bluffcatch'&&a.bettor) return res('call','可以跟（抓诈）','',0,[dispName(a.bettor)+' 诈唬不少，这里值得看一眼'],r.lesson,true);
  if(r.kind==='bluffcatch'||r.kind==='thin') return res('call','勉强能跟','',0,['数学上接近打平：跟可以，别再往里加钱'],r.lesson,true);
  if(r.kind==='draw') return res('call','跟注（博听牌）','',0,['算上中牌后还能多赢的钱，勉强可以追'],r.lesson,true);
  return res('fold','弃牌','warn',0,[pv(['跟下去长期亏钱','这一注的价格配不上你的胜率','别为了「看看对手有什么」付学费'])],r.lesson,r.close);
}
const PERSONA_READ={
  vera:'Vera 打法扎实，会专挑你的弱点下注',
  chip:'Chip 爱跟注、很少诈唬——突然加注时要当心',
  duke:'Duke 是疯子，下注不代表有牌，但拿真货时也打得一样大',
  mia:'Mia 爱演，台词和节奏常常是反的',
  oldk:'老K 极少诈唬，下重注时多半是真货',
  ghost:'Ghost 很平衡，读不出马脚，按数学打'
};
function coachRead(me,a){
  const o=a.bettor||a.opps.find(function(x){ return x.tilt>0; })||null;
  if(!o) return '';
  if(o.isAI&&o.persona){
    const nm=o.name;
    let s=PERSONA_READ[o.persona.id]||'';
    if(o.tilt>0) s+='；'+nm+' 刚上头，会打得更凶更松';
    if(a.bettor===o&&o.lastThink&&o.lastThinkSt===G.street&&o.lastThinkHand===G.handNo){
      if(o.lastThink<900) s+='。这次'+nm+'几乎是秒下'+(o.persona.tell==='fastbluff'?'——疯子出手越快越可能在演':o.persona.tell==='reverse'?'——但 Mia 的节奏常常是反的':'');
      else if(o.lastThink>2500) s+='。'+nm+'想了很久才下注'+(o.persona.tell==='actor'?'——Chip 长考后加注通常是大牌':'');
    }
    return s;
  }
  if(o.isHuman&&!o.isMe){
    const t=statOf(o);
    if(t.hands<4) return '';
    return esc(o.name)+' 入池 '+pctTxt(t.vpip)+'、面对下注弃牌 '+pctTxt(t.foldBet)+(t.bluffs?'，被看到诈唬 '+t.bluffs+' 次':'');
  }
  return '';
}
function coachLightHint(me,a){
  const need=a.need, c=a.cls;
  if(G.street===0){
    if(need===0) return '没人加注，可以<b>过牌</b>看翻牌，也可以<b>加注</b>施压。';
    return '跟注要 <b>'+fmt(need)+'</b>。拿不准就打开<b>教练模式</b>看胜率和建议。';
  }
  if(c.tier==='monster'||c.tier==='strong') return '你的牌很强（'+describeHand(me.hole.concat(G.board))+'），别让对手免费看牌。';
  if(c.tier==='draw') return '还没成手，但有听牌。'+(need?'价格合适再跟。':'可以考虑半诈唬。');
  if(c.tier==='medium') return '中等牌力。'+(need?'对手下重注时要谨慎。':'控制底池，别把自己打进大底池。');
  return need?'没击中，对手在施压。弃牌往往比硬跟划算。':'没击中。对手一直示弱的话，下注有机会直接赢下底池。';
}

  if(a.need>0&&me.stack<=a.need) html+='<br><span style="color:var(--brick-soft)">跟注需要动用全部筹码，等于 All-in。</span>';

/* 你每做一个决定，教练都对照它的建议记一笔：明显的失误当场点出来，并告诉你下次怎么做 */
function coachRecord(type,amount){
  const me=human();
  if(!me||me.hole.length<2||!me.hole[0]||me.folded||!COACH.hand) return;
  const a=coachAnalysis(me), adv=a.adv;
  const advN=adv.act==='bet'?'raise':adv.act;
  const d={street:G.street,type:type,amount:amount||0,need:a.need,pot:G.pot,eq:a.eq,potOdds:a.potOdds,
    tier:a.cls.tier,adv:advN,advLabel:adv.label,lesson:adv.lesson,close:adv.close,grade:'',note:''};
  if(type==='fold'&&a.need===0){
    d.grade='bad'; d.note='能免费过牌的时候别弃牌。'; d.lesson='';
  }else if(advN==='fold'&&(type==='call'||type==='raise')&&!adv.close){
    d.grade='bad';
    d.note=(type==='call'?'这一跟':'这次加注')+'不划算'+
      (G.street>0&&a.eq<a.potOdds?'：胜率约 '+pctTxt(a.eq)+'，却付了 '+pctTxt(a.potOdds)+' 的价格':'')+'。';
  }else if((advN==='call'||advN==='raise')&&type==='fold'&&a.need>0&&!adv.close&&a.eq>=a.potOdds+0.1){
    d.grade='bad'; d.note='弃得可惜：胜率约 '+pctTxt(a.eq)+'，跟注只需要 '+pctTxt(a.potOdds)+'。';
  }else if(advN==='raise'&&type!=='raise'&&a.cls.tier==='monster'&&!adv.close&&G.street>0){
    d.grade='meh'; d.note='拿着'+TIER_CN.monster+'没有下注，少收了一笔价值。';
  }else if(G.street===0&&advN==='raise'&&type==='call'&&!adv.close&&a.need<=G.bb){
    d.grade='meh'; d.note='平跟不如加注。';
  }else if(type===advN){
    if(type==='fold'&&a.need>0){ d.grade='good'; d.note=rpick(['好弃牌，省下的就是赚到的。','漂亮的弃牌。']); }
    else if(type==='raise'&&(a.cls.tier==='monster'||a.cls.tier==='strong')){ d.grade='good'; d.note=rpick(['好牌主动开火，没毛病。','价值下注，就该这么打。']); }
    else if(type==='call'&&a.need>=G.bb*3){ d.grade='good'; d.note='这一跟没问题。'; }
  }
  if(d.grade==='bad'&&d.lesson){
    d.leakN=leakAdd(d.lesson);
    if(d.leakN>=2) d.note+='这个毛病你已经犯过 '+d.leakN+' 次了。';
  }
  COACH.hand.decisions.push(d);
  if(d.lesson) accRecord(d.lesson,'real',d.grade==='bad'?false:ruleAccepts({act:advN,close:adv.close,lesson:adv.lesson},type)||d.grade==='good');
  (COACH.session||(COACH.session=[])).push(d);
  if(COACH.session.length>400) COACH.session.shift();
  const aiReview=G.coach&&AIC.coach&&AIC.review&&aiReady('coach');
  if(G.coach&&!aiReview&&d.note&&(d.grade!=='good'||Math.random()<0.35)){
    const lt=d.grade!=='good'&&d.lesson&&LESSON[d.lesson]?'<br><b>下次记住：</b>'+LESSON[d.lesson]:'';
    logLocal('<small>教练</small>'+d.note+lt,d.grade==='bad'?'tip warnlog':'tip');
  }
}
function coachHandEnd(){
  const me=human(), H=COACH.hand;
  if(!me||!H||H.reviewed||H.no!==G.handNo) return;
  H.reviewed=true;
  try{ handSave(me,H); }catch(e){}
  const dec=H.decisions;
  if(!dec.length) return;
  const played=dec.some(function(d){ return d.street>0||d.type==='call'||d.type==='raise'; });
  if(!played) return;
  if(G.coach&&AIC.coach&&AIC.review&&aiReady('coach')){ streamReview(me,H); return; }
  if(G.coach){
    const bad=dec.filter(function(d){ return d.grade==='bad'; });
    const good=dec.filter(function(d){ return d.grade==='good'; });
    if(bad.length) logLocal('<small>教练 · 本手小结</small>'+dec.length+' 个决定里有 '+bad.length+' 个明显亏：'+bad[0].note+
      (bad[0].lesson&&LESSON[bad[0].lesson]?'<br><b>下次记住：</b>'+LESSON[bad[0].lesson]:''),'tip warnlog');
    else if(good.length) logLocal('<small>教练 · 本手小结</small>'+dec.length+' 个决定都站得住，'+good[0].note,'tip');
  }
}

function renderAICoachBox(){
  const box=document.getElementById('aiCoach'), note=document.getElementById('aiNote');

/* AI 教练当家：教练模式 + AI 教练 + 自动分析都开着、而且连得上 —— 这时只显示 AI 的话，本地分析退到幕后 */
function aiCoachOwns(){
  return !!(G.coach&&AIC.coach&&AIC.coachAuto&&aiReady('coach'));
}
function aiCoachAbort(){
  if(COACH.aiCtl){ try{ COACH.aiCtl.abort(); }catch(e){} COACH.aiCtl=null; }
  COACH.aiBusy=false;
}
function aiCoachMaybeAuto(me,a){
  if(!aiCoachOwns()) return;
  if(!G.waiting||G.phase!=='betting'||COACH.aiSig===a.sig) return;
  askCoach('auto');
}
async function askCoach(mode){
  const me=human();
  const el=document.getElementById('aiCoachText');
  if(!me||!el) return;
  if(!aiReady('coach')){
    el.className='aitext dim';
    el.textContent=(AIC.key||AIC.claudeKey)?(aiErr('coach')||'AI 暂时不可用'):'先在「AI」里填好 DeepSeek 或 Claude 的 Key。';
    return;
  }
  if(me.hole.length<2||!me.hole[0]||me.folded||G.phase==='idle'){
    el.className='aitext dim'; el.textContent=G.phase==='idle'?'还没开局。':'这手你已经不在局里了，下一手再聊。';
    return;
  }
  const a=coachAnalysis(me);
  COACH.aiSig=a.sig; COACH.aiFailSig='';
  aiCoachAbort();
  const ctl=new AbortController();
  COACH.aiCtl=ctl; COACH.aiBusy=true;
  const prov=roleProv('coach');
  el.className='aitext live dim'; el.textContent=provLabel(prov)+' 正在想…';
  renderAICoachBox();
  let got=false;
  try{
    const txt=await aiChat('coach',{messages:coachMessages(me,a,mode),maxTokens:320,temperature:0.85,
      timeoutMs:prov==='claude'?90000:20000,signal:ctl.signal,
      onDelta:function(full){ if(COACH.aiCtl===ctl){ if(!got){ got=true; el.classList.remove('dim'); } el.textContent=full; } }});
    if(COACH.aiCtl===ctl){ el.classList.remove('dim'); el.textContent=txt||'（没有回复）'; }
  }catch(e){
    if(COACH.aiCtl===ctl){
      COACH.aiFailSig=a.sig;            /* 这一步 AI 没答上来：面板退回本地教练的建议 */
      el.className='aitext dim'; el.textContent='AI 教练暂时连不上：'+(aiErr('coach')||'网络问题')+'。先看上面的本地建议。';
    }
  }finally{
    if(COACH.aiCtl===ctl){ COACH.aiCtl=null; COACH.aiBusy=false; el.classList.remove('live'); }
    renderAICoachBox();
    render();
  }
}
function oppBrief(o,viewer){
  const mine=(G.hist||[]).filter(function(h){ return h.id===o.id&&h.t!=='sb'&&h.t!=='bb'; });
  const b={名字:dispName(o),筹码:o.stack,本手:mine.length?mine.map(function(h){
    return STREET_NAMES[h.st][1]+({fold:'弃牌',check:'过牌',call:'跟注',bet:'下注'+h.to,raise:'加注到'+h.to,allin:'全下'}[h.t]||h.t);
  }).join('，'):'还没行动'};
  if(o.isAI&&o.persona){
    b.类型='电脑 · '+o.persona.tag; b.人设=o.persona.style;
    if(o.tilt>0) b.情绪='刚输了大池，上头中';
    if(o.lastThink&&o.lastThinkSt===G.street&&o.lastThinkHand===G.handNo) b.出手节奏=o.lastThink<900?'几乎秒出手':o.lastThink>2500?'长考了很久':'正常';
  }else{
    const t=statOf(o);

      if(t.bluffs||t.values) b.摊牌记录='被看到诈唬 '+t.bluffs+' 次、价值 '+t.values+' 次';

const COACH_SYS='你是「午夜德扑」里坐在学员身后的私人德州扑克教练：职业牌手出身，说话直接、接地气，偶尔带点幽默。'+

function streamReview(me,H){
  const net=me.stack-(me.handStart||H.startStack||me.stack);

/* ---------- 操作区 ---------- */
function renderControls(){
  const me=human();
  const on=G.waiting&&G.phase==='betting'&&me&&!me.folded&&!me.out;
  const need=me?Math.max(0,G.currentBet-me.streetBet):0;
  const canCall=need>0&&me&&me.stack>0;
  const canCheck=need===0;
  const maxTarget=me?me.streetBet+me.stack:0;
  const minTarget=Math.min(maxTarget,Math.max(G.currentBet+G.minRaise,G.bb));

  document.getElementById('btnFold').disabled=!on;
  document.getElementById('btnCheck').disabled=!(on&&canCheck);
  const callBtn=document.getElementById('btnCall');
  callBtn.disabled=!(on&&canCall);
  callBtn.innerHTML=(need>=me.stack&&me.stack>0?'全下跟注':'跟注 '+fmt(Math.min(need,me.stack)))+'<small>CALL · C</small>';
  const canRaise=on&&me.stack>need&&maxTarget>=minTarget;
  document.getElementById('btnRaise').disabled=!canRaise;
  document.getElementById('btnAllin').disabled=!(on&&me.stack>0);

  const slider=document.getElementById('slider');
  slider.disabled=!canRaise;
  if(canRaise){
    slider.min=String(minTarget); slider.max=String(maxTarget); slider.step=String(Math.max(1,G.sb));
    if(+slider.value<minTarget||+slider.value>maxTarget) slider.value=String(Math.min(maxTarget,minTarget));
    document.getElementById('slMin').textContent='最小 '+fmt(minTarget);
    document.getElementById('slMax').textContent='全下 '+fmt(maxTarget);
  }else{
    document.getElementById('slMin').textContent='';
    document.getElementById('slMax').textContent='';
  }
  document.getElementById('qMinus').disabled=!canRaise;
  document.getElementById('qPlus').disabled=!canRaise;
  document.getElementById('qHalf').disabled=!canRaise;
  document.getElementById('qPot').disabled=!canRaise;
  document.getElementById('qAll').disabled=!on;
  /* 倍数键的基准：桌上有人下注就按当前注算，无人下注（翻牌后第一家）退化成 N 倍大盲。
     提示里带出实际会加到的金额，点之前就知道这手要压多少。 */
  [2,5,10].forEach(function(n){
    const b=document.getElementById('qX'+n);
    b.disabled=!canRaise;
    if(canRaise) b.title='加注到当前注的 '+n+' 倍 · '+fmt(snapTarget(mulBase()*n));
  });
  document.getElementById('raiseAmt').disabled=!canRaise;
  updateRaiseAmt();

  const side=document.getElementById('sideNote');
  if(NET.online&&!NET.isHost){
    side.innerHTML= on
      ? '轮到你，<b>'+(canCheck?'可以免费过牌':'跟注 '+fmt(Math.min(need,me.stack)))+'</b>'
      : (G.phase==='betting'
          ? '等 <b>'+esc(G.players[G.actor]?G.players[G.actor].name:'对手')+'</b> 行动…'
          : (G.phase==='idle'?'等房主开局…':'本手结束'));
  }else{
    side.innerHTML= gamePaused
      ? '<b>'+HINT_PAUSED+'</b>'
      : (on
          ? '轮到你。<b>'+(canCheck?'可以免费过牌':'跟注 '+fmt(Math.min(need,me.stack))) +'</b>'
          : (G.phase==='betting'?'等待对手行动…　<b>'+HINT_PAUSE+'</b>':'本手结束'));
  }
  if(!on){ document.getElementById('raiseAmt').value=G.phase==='idle'?'—':''; }
}
/* 暂停 / 继续：冻结整局流程，方便看清桌上发生了什么 */
function setPaused(v){
  gamePaused=!!v;

function raiseTarget(){ return +document.getElementById('slider').value; }
function updateRaiseAmt(){
  const me=human(); if(!me) return;
  const t=raiseTarget();
  const extra=t-me.streetBet;
  document.getElementById('raiseAmt').value=(extra>0?'+':'')+fmt(extra);
  const s=document.getElementById('slider');
  const lo=+s.min, hi=+s.max;
  const pct=hi>lo?((t-lo)/(hi-lo)*100):0;
  s.style.setProperty('--slide-fill',
    'linear-gradient(to right,rgba(201,164,76,.8) 0%,rgba(201,164,76,.8) '+pct+'%,rgba(242,234,218,.12) '+pct+'%,rgba(242,234,218,.12) 100%)');
}

/* 日志除了画在屏幕上，还要留一份带序号的副本：
   联机时房主把它塞进视角快照，客户端按序号补齐缺的那几条。 */
let LOG_SEQ=0;
const LOG_BUF=[];
function log(html,cls){
  const item={n:++LOG_SEQ,html:html,cls:cls||''};
  LOG_BUF.push(item);
  if(LOG_BUF.length>140) LOG_BUF.shift();
  logPaint([item]);
}
/* 把若干条日志插到最前面；传入顺序为旧→新，所以后插的会跑到更前面 */
function logPaint(items){
  const box=document.getElementById('log');
  for(const it of items){
    const el=document.createElement('div');
    el.className='log-item'+(it.cls?' '+it.cls:'');
    el.innerHTML=it.html;
    box.insertBefore(el,box.firstChild);
  }
  while(box.children.length>90) box.removeChild(box.lastChild);
}

  b.classList.add('show');
  /* 兜底：动画万一被打断也不会永久盖在桌面上 */

function seatCountSave(n){ try{ localStorage.setItem(SEAT_STORE,String(n)); }catch(e){} }
function initGame(roster){
  /* isHuman = 由真人操控（联机时会有多位）；isMe = 本机玩家（只有一位，决定谁能看到什么牌）
     roster 传入时按房间成员建桌，空位用电脑补齐 */
  const humans=(roster&&roster.length)?roster:null;
  G.players=humans
    ? humans.map(function(m){
        return newSeat({id:'m_'+m.pid,pid:m.pid,name:m.nick,av:(m.nick||'?').slice(0,1).toUpperCase(),
          tag:m.isHost?'房主 · HOST':'玩家 · PLAYER',isHuman:true,isMe:m.pid===NET.pid,isAI:false});
      })
    : [newSeat({id:'you',name:'你',av:'R',tag:'',isHuman:true,isMe:true,isAI:false})];
  /* 每开一局换一桌人：至少一位爱施压的，另外两位随机 */
  const crew=pickPersonas(humans?3:seatCountLoad()-1);
  const aiSeat=function(P){
    return newSeat({id:P.id,name:P.name,av:P.av,tag:P.tag,isHuman:false,isMe:false,isAI:true,persona:P});
  };
  if(humans){
    for(let i=G.players.length;i<4;i++) G.players.push(aiSeat(crew[(i-humans.length)%3]));
  }else{
    crew.forEach(function(P){ G.players.push(aiSeat(P)); });
  }
  G.hist=[]; G.pfRaises=0; G.pfAggId=null; G.streetRaises=0; G.lastAggId=null;
  COACH.session=[];
  G.handNo=0; G.button=G.players.length-1; G.phase='idle'; G.board=[]; G.pot=0; G.street=0;
  G.stats={hands:0,wins:0,net:0};
  G.winnerIds=[];
  G.actorPid=null;
  /* 开新局：日志重新编号，联机时客户端靠 gameSeq 判断该不该清屏 */
  LOG_SEQ=0; LOG_BUF.length=0;
  document.getElementById('log').innerHTML='';
  NET.gameSeq++; NET.results={}; NET.banner=null;
  hideResult();
  buildTable();
  render();
  positionSeats();
  log('<small>欢迎</small>娱乐桌开局，每人 <span class="hl">'+fmt(G.startStack)+'</span> 筹码，盲注 '+G.sb+'/'+G.bb+'。','tip');
  if(humans){
    log('<small>联机</small>房间 <b>'+NET.roomId+'</b> · '+'在座：'+G.players.filter(function(p){return p.isHuman;}).map(function(p){return esc(p.name);}).join('、'),'tip');
  }else{
    log('<small>提示</small>'+(typeof matchMedia==='function'&&matchMedia('(max-width:900px)').matches?'<b>AI</b>、<b>联机</b>、<b>牌型表</b>都在右上角 <b>☰</b> 菜单里；AI 里可以调牌桌强度、接入 DeepSeek。':'点右上角<b>新手引导</b>看玩法，<b>牌型表</b>随时查牌力大小；<b>AI</b> 里可以调牌桌强度、接入 DeepSeek。'),'tip');
  }
  const bots=G.players.filter(function(p){ return p.isAI; });
  if(bots.length){
    log('<small>今晚同桌</small>'+bots.map(function(p){ return '<b>'+esc(p.name)+'</b>（'+esc(p.tag)+'）'; }).join('、')+
      ' —— 他们会记住你的打法。','tip');
  }
}
/* 座位的公共字段：筹码、本手状态、打法统计（给电脑读你用）、计划、情绪、台词 */
function newStats(){
  return {hands:0,vpip:0,pfr:0,tbOpp:0,tb:0,sawFlop:0,wtsd:0,wsd:0,cbetOpp:0,cbet:0,fcbOpp:0,fcb:0,
    facedBet:0,foldBet:0,callBet:0,raiseBet:0,agg:0,pass:0,bluffs:0,values:0,recent:[]};
}
function newSeat(o){
  return Object.assign({stack:G.startStack,hole:[],streetBet:0,committed:0,folded:false,allIn:false,
    acted:false,out:false,left:false,reveal:false,lastAction:'',
    buyins:1,st:newStats(),hf:{},plan:null,lastTone:'',tilt:0,thinking:0,sayText:'',sayN:0,handStart:G.startStack},o);
}

function nextSeat(from,skip){
  if(!skip) skip=function(p){return p.out||p.folded||p.allIn;};
  let i=from;
  for(let n=0;n<8;n++){
    i=(i+1)%G.players.length;
    if(i===from) break;
    if(skip(G.players[i])) continue;
    return i;
  }
  return -1;
}
function canAct(p){ return !p.folded&&!p.allIn&&!p.out&&p.stack>0; }
function livePlayers(){ return G.players.filter(function(p){return !p.folded&&!p.out;}); }
function checkAbort(token){ if(token!==G.token) throw ABORT; }

async function startHand(){
  if(G.busy) return;
  G.busy=true;
  const token=++G.token;
  try{
    await runHand(token);
  }catch(e){
    if(e!==ABORT) console.error(e);
  }
  if(token!==G.token){ G.busy=false; return; }
  G.busy=false;
  startHand();
}

async function runHand(token){
  /* 破产补码 */
  for(const p of G.players){
    if(p.stack<=0&&!p.out&&!p.left){
      p.stack=G.startStack;
      p.buyins=(p.buyins||1)+1;
      if(p.isMe) log('<small>补码</small>你又借了一手 <span class="hl">'+fmt(G.startStack)+'</span>（共借 '+p.buyins+' 手）。','tip');
      else log('<small>补码</small>'+esc(p.name)+' 又借了一手（共借 '+p.buyins+' 手）。');
    }
  }
  const alive=G.players.filter(function(p){return p.stack>0&&!p.out&&!p.left;});
  if(alive.length<2) return;

  G.handNo++; G.stats.hands++;
  G.board=[]; G.pot=0; G.street=0; G.winnerIds=[]; G.phase='deal';
  G.hist=[]; G.pfRaises=0; G.pfAggId=null; G.streetRaises=0; G.lastAggId=null;
  G.players.forEach(function(p){
    p.hole=[]; p.streetBet=0; p.committed=0; p.folded=p.stack<=0||p.left||p.out;
    p.allIn=false; p.acted=false; p.reveal=false; p.lastAction='';
    p.hf={}; p.plan=null; p.lastTone=''; p.thinking=0; p.handStart=p.stack;
    if(p.tilt>0) p.tilt--;
  });
  coachHandStart();
  /* 庄家位轮转 */
  G.button=nextSeat(G.button,function(p){return p.stack<=0||p.out||p.left;});
  /* 单挑时庄家下小盲（翻前先说话、翻后最后说话），三人以上才是庄家下一位下小盲 */
  const seated=G.players.filter(function(p){ return !(p.stack<=0||p.out||p.left); }).length;
  const sbSeat=seated===2?G.button:nextSeat(G.button,function(p){return p.stack<=0||p.out||p.left;});
  const bbSeat=nextSeat(sbSeat,function(p){return p.stack<=0||p.out||p.left;});
  G.sbId=G.players[sbSeat].id;
  G.bbId=G.players[bbSeat].id;

  G.deck=shuffle(makeDeck());
  /* 发底牌 */
  for(let round=0;round<2;round++){
    let i=G.button;
    for(let n=0;n<G.players.length;n++){
      i=(i+1)%G.players.length;
      const p=G.players[i];
      if(p.folded||p.out) continue;
      p.hole.push(G.deck.pop());
      sfxDeal();
      render();
      await sleep(120);
    }
  }
  /* 盲注 */
  postBlind(G.players[sbSeat],G.sb,'sb');
  postBlind(G.players[bbSeat],G.bb,'bb');
  G.currentBet=G.bb;
  G.minRaise=G.bb;

  banner('第 '+G.handNo+' 手');
  log('<small>第 '+G.handNo+' 手</small>庄家 <b>'+esc(G.players[G.button].name)+'</b> · 小盲 '+esc(G.players[sbSeat].name)+' · 大盲 '+esc(G.players[bbSeat].name));
  checkAbort(token);
  G.phase='betting';
  G.actor=nextSeat(bbSeat);
  render();
  await playStreet(token);

  if(G.phase!=='over'){
    for(let st=1;st<=3;st++){
      checkAbort(token);
      const live=livePlayers();
      const actives=live.filter(function(p){return !p.allIn;});
      if(live.length<=1) break;
      await dealStreet(st,token);
      if(actives.length<=1&&live.length>1){
        /* 全部 all-in，直接发完剩余公共牌 */
        log('<small>全下</small>所有下注已全下，直接发完公共牌摊牌。');
        continue;
      }
      await playStreet(token);
      if(G.phase==='over') break;
    }
  }
  if(G.phase!=='over') await showdown(token);

  checkAbort(token);
  G.phase='over';
  handEnd();
  render();
  await sleep(2600);
  checkAbort(token);
  G.winnerIds=[];
  hideResult();
}

function postBlind(p,amt,kind){
  const a=Math.min(amt,p.stack);
  p.stack-=a; p.streetBet+=a; p.committed+=a; G.pot+=a;
  if(p.stack===0) p.allIn=true;
  G.hist.push({st:0,id:p.id,name:p.name,t:kind||'blind',to:a,add:a,need:0,pot:G.pot-a,rno:0,raise:false});
  sfxChip();
}

async function dealStreet(st,token){
  G.street=st;
  G.players.forEach(function(p){p.streetBet=0;p.acted=false;});
  G.currentBet=0; G.minRaise=G.bb;
  G.streetRaises=0; G.lastAggId=null;
  if(st===1) G.players.forEach(function(p){ if(!p.folded&&!p.out&&p.hf) p.hf.sawFlop=1; });
  const n=st===1?3:1;
  for(let i=0;i<n;i++){
    G.board.push(G.deck.pop());
    render();
    sfxDeal();
    await sleep(230);
    checkAbort(token);
  }
  const s=STREET_NAMES[st];
  log('<small>'+s[0]+' '+s[1]+'</small>公共牌：<span class="hl">'+G.board.map(cardText).join(' ')+'</span>');
  G.actor=nextSeat(G.button);
  render();
  await sleep(420);
  checkAbort(token);
}

async function playStreet(token){
  let guard=0;
  while(guard++<60){
    checkAbort(token);
    const live=livePlayers();
    if(live.length<=1) break;
    const actives=live.filter(canAct);
    if(actives.length===0) break;
    const pend=actives.filter(function(p){return !p.acted||p.streetBet<G.currentBet;});
    if(pend.length===0) break;
    const i=G.actor;
    const p=G.players[i];
    if(!p||!canAct(p)||(p.acted&&p.streetBet>=G.currentBet)){
      G.actor=nextSeat(i);
      if(G.actor<0) break;
      continue;
    }
    G.phase='betting';
    render();
    if(p.isHuman){
      NET.turnStartAt=Date.now();
      G.waiting=!!p.isMe; render();
      const needle=scheduleNeedle(p,token);
      let act;
      try{ act=await humanTurn(p,token); }
      finally{ clearTimeout(needle); }
      checkAbort(token);
      G.waiting=false;
      const prevAgg=G.lastAggId;
      applyAction(p,act);
      reactToHuman(p,act,prevAgg);
    }else{
      G.waiting=false;
      const act=await aiTurn(p,token);
      checkAbort(token);
      applyAction(p,act);
    }
    render();
    if(livePlayers().length<=1) break;
    G.actor=nextSeat(i);
    if(G.actor<0) break;
  }
  /* 清掉本街显示 */
  await sleep(340);
  checkAbort(token);
  G.players.forEach(function(p){ p.streetBet=0; });
  render();
}

function waitAction(p,token){
  return new Promise(function(resolve,reject){
    G.pending={resolve:resolve,reject:reject,token:token};
  });
}

/* ---------- 一位真人的一次决策 ----------
   单机：直接用界面上的按钮（G.pending），没有倒计时。
   联机：不管是谁（包括房主本人）都有倒计时兜底 —— 到点还没动作就自动过牌或弃牌，
   否则一个人挂机就能把整桌人锁死。远程玩家的动作由中继排队，房主在这里取。 */
async function humanTurn(p,token){
  if(!NET.online) return await waitAction(p,token);
  const local=!!p.isMe;
  const grace=(p.connected===false)?Math.min(8000,NET.turnMs):NET.turnMs;
  let deadline=Date.now()+grace;
  NET.waiting={pid:p.pid,deadline:deadline,left:Math.ceil(grace/1000)};
  if(local){
    G.pending={resolve:function(a){ got=a; },reject:function(){},token:token};
  }
  let got=null,guard=0;
  pushViews();
  try{
    while(guard++<400){
      checkAbort(token);
      if(local){
        await nsleep(250);
        if(got) break;
      }else{
        got=await popRemote(p.pid,500,NET.turnStartAt);
        if(got) break;
      }
      if(Date.now()>=deadline){
        /* 房主暂停时网开一面：暂停不该吃掉别人的思考时间 */
        if(gamePaused){ deadline=Date.now()+grace; }
        else break;
      }
      NET.waiting.deadline=deadline;
      const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
      if(left!==NET.waiting.left){ NET.waiting.left=left; pushViews(); }
    }
  }finally{
    NET.waiting=null;
    if(local) G.pending=null;
  }
  if(!got){
    const need=Math.max(0,G.currentBet-p.streetBet);
    got={type:need>0?'fold':'check'};
    log('<small>超时</small><b>'+esc(p.name)+'</b> 没有动作，自动'+(got.type==='check'?'过牌':'弃牌')+'。','tip');
  }
  return got;
}

/* ---------- 远程动作队列（房主侧） ---------- */
let remoteQ=[];
let remoteWaiters=[];
let hostAck=[];
function remoteNotify(){
  const ws=remoteWaiters.splice(0,remoteWaiters.length);
  ws.forEach(function(f){ f(); });
}
function remoteWait(ms){
  return new Promise(function(res){
    const fn=function(){
      clearTimeout(t);
      const i=remoteWaiters.indexOf(fn);
      if(i>=0) remoteWaiters.splice(i,1);
      res();
    };
    const t=setTimeout(fn,ms);
    remoteWaiters.push(fn);
  });
}
/* 取 pid 的动作；早于本轮开始时间的（上一街残留）直接丢掉 */
async function popRemote(pid,ms,notBefore){
  const deadline=Date.now()+ms;
  for(;;){
    const i=remoteQ.findIndex(function(a){return a.pid===pid;});
    if(i>=0){
      const a=remoteQ.splice(i,1)[0];
      if(notBefore&&a.at&&a.at<notBefore) continue;
      return a;
    }
    const left=deadline-Date.now();
    if(left<=0) return null;
    await remoteWait(Math.min(left,600));
  }
}
/* 房主收到中继推来的动作：入队 + 记下要回的执条 */
function hostIngest(list){
  if(!Array.isArray(list)) return;
  for(const a of list){
    if(!a||!a.aid||NET.seen.has(a.aid)) continue;
    NET.seen.add(a.aid);
    NET.seenQ.push(a.aid);
    while(NET.seenQ.length>300) NET.seen.delete(NET.seenQ.shift());
    hostAck.push(a.aid);
    if(a.type==='leave'){ hostOnLeave(a.pid); continue; }
    if(a.type==='ready'||a.type==='start'||a.type==='ping') continue;
    remoteQ.push(a);
  }
  if(hostAck.length>200) hostAck=hostAck.slice(-200);
  remoteNotify();
}
/* 有人离开：本手弃掉，之后不再参与（座位留着显示成「离开」） */
function hostOnLeave(pid){
  const p=G.players.find(function(x){return x.pid===pid;});
  if(!p||p.left) return;
  p.left=true; p.folded=true; p.out=true; p.lastAction='离开';
  log('<small>离开</small><b>'+esc(p.name)+'</b> 已离桌。','tip');
  remoteQ=remoteQ.filter(function(a){return a.pid!==pid;});
  if(NET.waiting&&NET.waiting.pid===pid) NET.waiting.deadline=Date.now();
  render();
  const humans=G.players.filter(function(x){return x.isHuman&&!x.left;});
  if(humans.length===0) netFatal('桌上没人了');
}

function applyAction(p,act){
  if(!act) act={type:'check'};
  const needBefore=Math.max(0,G.currentBet-p.streetBet);
  const potBefore=G.pot, betBefore=G.currentBet;
  if(act.type==='fold'){
    p.folded=true; p.lastAction='Fold';
    sfxFold();
    log('<b>'+esc(p.name)+'</b> <span style="color:var(--brick-soft)">弃牌 Fold</span>');
    trackAction(p,'fold',p.streetBet,0,needBefore,potBefore,false);
    if(p.isMe) coachAfterFold();
  }else if(act.type==='check'){
    p.acted=true; p.lastAction='Check'; sfxCheck();
    log('<b>'+esc(p.name)+'</b> 过牌 Check');
    trackAction(p,'check',p.streetBet,0,needBefore,potBefore,false);
  }else if(act.type==='call'){
    const need=Math.min(G.currentBet-p.streetBet,p.stack);
    p.stack-=need; p.streetBet+=need; p.committed+=need; G.pot+=need;
    if(p.stack<=0){p.allIn=true;}
    p.acted=true; p.lastAction='Call';
    sfxChip();
    log('<b>'+esc(p.name)+'</b> 跟注 Call <span class="hl">'+fmt(need)+'</span>'+(p.allIn?' <span style="color:var(--brick-soft)">All-in</span>':''));
    trackAction(p,p.allIn?'allin':'call',p.streetBet,need,needBefore,potBefore,false);
  }else if(act.type==='raise'){
    const max=p.streetBet+p.stack;
    const minLegal=Math.min(max,G.currentBet+G.minRaise);
    let target=Math.min(act.amount,max);
    if(target<minLegal) target=minLegal;
    const add=target-p.streetBet;
    if(add<=0) return applyAction(p,{type:'check'});
    p.stack-=add; p.streetBet=target; p.committed+=add; G.pot+=add;
    const inc=target-G.currentBet;
    if(inc>=G.minRaise) G.minRaise=inc;
    G.currentBet=Math.max(G.currentBet,target);
    if(p.stack<=0) p.allIn=true;
    for(const q of G.players) if(q!==p&&!q.folded&&!q.out&&!q.allIn) q.acted=false;
    p.acted=true; p.lastAction=p.allIn?'All-in':'Raise';
    sfxChip(); tone(1400,.06,'square',.028,.05);
    const raised=target>betBefore;
    const verb=p.allIn?'<span style="color:var(--brick-soft)">All-in 全下</span>':(betBefore===0&&G.street>0?'下注 Bet':'加注到 Raise to');
    log('<b>'+esc(p.name)+'</b> '+verb+' <span class="hl">'+fmt(target)+'</span>'+
      (raised&&G.street>0&&!p.allIn&&(target-betBefore)>(potBefore+needBefore)*1.1?' <span style="color:var(--brick-soft)">超池</span>':''));
    if(p.allIn){
      log('&nbsp;&nbsp;<span style="color:var(--ivory-faint)">'+esc(p.name)+' 把全部筹码推了进去。</span>');
      if(p.isAI&&raised){ banner(p.name+' 全下'); sfxAllin(); }
    }
    trackAction(p,p.allIn?'allin':(betBefore===0&&G.street>0?'bet':'raise'),target,add,needBefore,potBefore,raised);
  }
  render();
}

/* ---------- 记账：本手行动记录 + 每位玩家的打法统计 ----------
   电脑靠这些数字「读」你：入池率、翻前加注、面对持续下注弃牌率、激进度、被抓到的诈唬…… */
function trackAction(p,t,to,add,needBefore,potBefore,raised){
  const hf=p.hf||(p.hf={}), st=p.st||(p.st=newStats());
  const street=G.street;
  if(street===0){
    if(G.pfRaises===1&&p.id!==G.pfAggId) hf.tbOpp=1;
    if(t!=='fold'&&t!=='check'&&add>0) hf.vpip=1;
    if(raised){ hf.pfr=1; if(hf.tbOpp) hf.tb=1; }
  }else{
    if(needBefore>0){
      st.facedBet++;
      if(t==='fold') st.foldBet++; else if(raised) st.raiseBet++; else st.callBet++;
    }
    if(raised) st.agg++; else if(t==='call'||t==='allin') st.pass++;
    if(street===1&&p.id===G.pfAggId&&G.streetRaises===0){ hf.cbetOpp=1; if(raised) hf.cbet=1; }
    if(street===1&&needBefore>0&&G.streetRaises===1&&G.lastAggId===G.pfAggId&&p.id!==G.pfAggId){
      hf.fcbOpp=1; if(t==='fold') hf.fcb=1;
    }
  }
  if(raised){
    if(street===0){ G.pfRaises++; G.pfAggId=p.id; }
    G.streetRaises++; G.lastAggId=p.id;
  }
  G.hist.push({st:street,id:p.id,name:p.name,t:t,to:to,add:add,need:needBefore,pot:potBefore,
    rno:street===0?G.pfRaises:0,raise:!!raised});
}
function commitHandStats(){
  for(const p of G.players){
    if(!p.hole||p.hole.length<2||!p.st) continue;
    const st=p.st, hf=p.hf||{};
    st.hands++;
    if(hf.vpip) st.vpip++;
    if(hf.pfr) st.pfr++;
    if(hf.tbOpp){ st.tbOpp++; if(hf.tb) st.tb++; }
    if(hf.sawFlop) st.sawFlop++;
    if(hf.wtsd) st.wtsd++;
    if(hf.wsd) st.wsd++;
    if(hf.cbetOpp){ st.cbetOpp++; if(hf.cbet) st.cbet++; }
    if(hf.fcbOpp){ st.fcbOpp++; if(hf.fcb) st.fcb++; }
  }
}
/* 带先验的比率：样本少的时候别被一两手牌带偏 */
function statOf(p){
  const s=(p&&p.st)||newStats();
  const r=function(n,d,prior,w){ return (n+prior*w)/(d+w); };
  return {hands:s.hands,
    vpip:r(s.vpip,s.hands,0.32,6), pfr:r(s.pfr,s.hands,0.14,6), threeBet:r(s.tb,s.tbOpp,0.06,4),
    af:(s.agg+1.2)/(s.pass+1.5), foldBet:r(s.foldBet,s.facedBet,0.45,5), fcb:r(s.fcb,s.fcbOpp,0.45,4),
    cbet:r(s.cbet,s.cbetOpp,0.6,4), wtsd:r(s.wtsd,s.sawFlop,0.3,4),
    bluffs:s.bluffs, values:s.values, recent:s.recent||[]};
}
function bluffTendency(o){
  if(!o) return 0.15;
  if(o.isAI&&o.persona) return clamp01(o.persona.bluff*(o.tilt>0?1.4:1));
  const t=statOf(o);
  return Math.max(0.05,Math.min(0.6,0.12+(t.bluffs/(t.bluffs+t.values+2))*0.45+(t.af-1)*0.05));
}
function foldProb(o,vsPfAgg){
  if(o.isAI&&o.persona) return clamp01(o.persona.foldToPressure*(o.tilt>0?0.8:1));
  const t=statOf(o);
  return (G.street===1&&vsPfAgg)?t.fcb:t.foldBet;
}
/* 站在别人的角度估计 o 的范围（给 rangeEquity 用）：看他这手牌翻前怎么进的池、翻后打得多凶 */
function oppModel(o){
  const P=o.persona||null, st=P?null:statOf(o);
  const vpip=P?P.vpip:st.vpip, pfr=P?P.pfr:st.pfr;
  const clampR=function(x,a,b){ return x<a?a:x>b?b:x; };
  let maxR=0, called=false, limped=false, agg=0, calls=0;
  for(const h of (G.hist||[])){
    if(h.id!==o.id) continue;
    if(h.st===0){
      if(h.raise) maxR=Math.max(maxR,h.rno);
      else if(h.t==='call'||h.t==='allin'){ if(h.rno>0) called=true; else limped=true; }
    }else{
      if(h.raise) agg++;
      else if(h.t==='call'||h.t==='allin') calls++;
    }
  }
  let pfMin=0;
  if(maxR>=2) pfMin=1-clampR(pfr*0.4,0.04,0.16);
  else if(maxR===1) pfMin=1-clampR(pfr*1.05,0.08,0.45);
  else if(called) pfMin=1-clampR(vpip*0.8,0.1,0.6);
  else if(limped) pfMin=1-clampR(vpip,0.15,0.75);
  return {pfMin:pfMin,agg:Math.min(3,agg),calls:calls,bluff:bluffTendency(o),
    loose:P?1-P.foldToPressure:1-st.foldBet};
}

/* ============================================================
   9b. 电脑对手上场：拍快照 → 想（含时间马脚 / DeepSeek）→ 出手 → 说话
   ============================================================ */
let SAY_SEQ=0;
/* 翻牌后行动顺序：庄家左手第一位开始，还能行动的人里谁排最后谁就有位置 */
function postflopOrder(){
  const out=[];
  let i=G.button;
  for(let n=0;n<G.players.length;n++){
    i=(i+1)%G.players.length;
    const q=G.players[i];
    if(!q.folded&&!q.out) out.push(q);
  }
  return out;
}
function aiSnapshot(p){
  const opps=G.players.filter(function(o){ return o!==p&&!o.folded&&!o.out; });
  const need=Math.max(0,G.currentBet-p.streetBet);
  const maxTo=p.streetBet+p.stack;
  const minTo=Math.min(maxTo,Math.max(G.currentBet+G.minRaise,G.bb));
  const eq=rangeEquity(p.hole,G.board,opps.map(oppModel),G.board.length?240:180);
  const order=postflopOrder().filter(function(q){ return !q.allIn||q===p; });
  const idx=G.players.indexOf(p);
  const lastAgg=G.lastAggId?G.players.find(function(q){ return q.id===G.lastAggId; }):null;
  let limpers=0;
  if(G.pfRaises===0) for(const h of G.hist) if(h.st===0&&h.t==='call') limpers++;
  let foldEq=1;
  for(const o of opps){ if(!o.allIn) foldEq*=foldProb(o,G.pfAggId===p.id); }
  let scare=false;
  if(G.board.length>=4){
    const c=G.board[G.board.length-1], prev=G.board.slice(0,-1);
    const sc={}; G.board.forEach(function(x){ sc[x.s]=(sc[x.s]||0)+1; });
    scare=(c.r>Math.max.apply(null,prev.map(function(x){return x.r;}))&&c.r>=11)||sc[c.s]===3||
      prev.some(function(x){ return x.r===c.r; });
  }
  return {persona:p.persona,level:AIC.level,tilt:p.tilt>0?1:0,plan:p.plan,
    hole:p.hole,board:G.board,street:G.street,pot:G.pot,need:need,stack:p.stack,streetBet:p.streetBet,
    currentBet:G.currentBet,minRaise:G.minRaise,minTo:minTo,maxTo:maxTo,bb:G.bb,sb:G.sb,
    nOpp:opps.length,inPos:order.length>0&&order[order.length-1]===p,posLate:idx===G.button,
    isBlind:p.id===G.sbId?'sb':(p.id===G.bbId?'bb':null),
    pfRaises:G.pfRaises,streetRaises:G.streetRaises,isPfAgg:G.pfAggId===p.id,limpers:limpers,
    facingAllIn:need>0&&(need>=p.stack||!!(lastAgg&&lastAgg.allIn)),
    foldEq:foldEq,bettorBluff:bluffTendency(lastAgg),tex:boardTexture(G.board),scare:scare,
    cls:classifyHand(p.hole,G.board),eq:eq};
}
async function aiTurn(p,token){
  const s=aiSnapshot(p);
  let d=brainDecide(s);
  let ms=brainThinkMs(s,d);
  let said='', llmUsed=false;
  p.thinking=1; render();
  if(wantBrainAI(p,s,d)){
    const t0=Date.now();
    const tankT=setTimeout(function(){ if(p.thinking===1&&token===G.token){ p.thinking=2; render(); } },2200);
    const llm=await dsDecide(p,s,d);
    clearTimeout(tankT);
    checkAbort(token);
    if(llm){ d=llm.d; said=llm.say||''; llmUsed=true; ms=brainThinkMs(s,d); }
    ms=Math.max(0,ms-(Date.now()-t0));
  }
  /* 慢慢想：分段睡，暂停时能停住；想超过 2.2 秒就挂上「长考」 */
  let waited=p.thinking===2?2200:0;
  while(waited<ms){
    const chunk=Math.min(220,ms-waited);
    await sleep(chunk);
    checkAbort(token);
    waited+=chunk;
    if(waited>=2200&&p.thinking!==2){
      p.thinking=2; render();
      if(p.persona.tell==='actor'&&d.tone!=='bluff'&&talkMode()>0&&Math.random()<0.5) aiSay(p,rpick(p.persona.lines.tank));
    }
  }
  p.thinking=0;
  p.lastThink=Math.max(ms,waited); p.lastThinkSt=G.street; p.lastThinkHand=G.handNo;
  p.plan=d.plan||(d.type==='raise'?((d.tone==='bluff'||d.tone==='semi')?'barrel':'value'):null);
  p.lastTone=d.tone;
  aiAfterDecide(p,s,d,said,llmUsed);
  return {type:d.type,amount:d.amount};
}
function talkMode(){
  /* 0 关；1 本地台词；2 DeepSeek 现编（没有 Key 时退回本地） */
  const m=AIC.talkMode==null?2:AIC.talkMode;
  return m>=2&&!aiReady('opp')?1:m;
}
function aiAfterDecide(p,s,d,said,llmUsed){
  if(talkMode()===0) return;
  if(said){ aiSay(p,said); return; }
  if(llmUsed) return;          /* DeepSeek 决定这次不说话，就别再硬凑一句 */
  const ev=brainTalkEvent(d,s);
  if(Math.random()>=brainTalkChance(ev,p.persona,AIC.level)) return;
  const big=ev==='allin'||ev==='bigbet'||ev==='checkraise';
  quip(p,ev,{big:big});
}
function aiSay(p,text){
  text=String(text||'').replace(/[\r\n\t]+/g,' ').replace(/^["“「『]+|["”」』]+$/g,'').trim();
  if(!text) return;
  if(text.length>28) text=text.slice(0,28)+'…';
  p.sayText=text; p.sayN=++SAY_SEQ;
  log('<span class="talk"><b>'+esc(p.name)+'</b>：「'+esc(text)+'」</span>');
  render();
}
/* 开口说一句：能用 DeepSeek 就现编（大动作、特殊时刻），否则用本地台词库 */
function quip(p,ev,extra){
  if(!p||!p.persona||talkMode()===0) return;
  const local=rpick(p.persona.lines[ev]);
  if(talkMode()===2&&(ev!=='call'&&ev!=='check'&&ev!=='fold')){
    dsQuip(p,ev,extra).then(function(t){ aiSay(p,t||local); });
    return;
  }
  if(local) aiSay(p,local);
}
/* 你想太久，桌上会有人催你 */
function scheduleNeedle(p,token){
  if(!p.isHuman||talkMode()===0) return null;
  const ms=[18000,12000,8000][AIC.level==null?1:AIC.level];
  const fire=function(){
    if(token!==G.token||G.phase!=='betting'||G.players[G.actor]!==p) return;
    if(gamePaused){ p._needle=setTimeout(fire,3000); return; }
    const cands=G.players.filter(function(o){ return o.isAI&&!o.folded&&!o.out&&o.persona&&o.persona.lines.needle.length; });
    if(!cands.length) return;
    const who=cands.find(function(o){ return o.id===G.lastAggId; })||
      cands.slice().sort(function(a,b){ return b.persona.chatty-a.persona.chatty; })[0];
    if(Math.random()<0.85) quip(who,'needle',{waitS:Math.round(ms/1000)});
  };
  return setTimeout(fire,ms);
}
/* 你的动作会引来反应：你一推，有人要说话；你被吓跑，下注的人会得意 */
function reactToHuman(p,act,prevAgg){
  if(p._needle){ clearTimeout(p._needle); p._needle=null; }
  if(talkMode()===0) return;
  const lv=[0.6,1,1.3][AIC.level==null?1:AIC.level];
  if(p.allIn&&p.lastAction==='All-in'){
    const c=G.players.filter(function(o){ return o.isAI&&!o.folded&&!o.out&&o.persona; });
    if(c.length){
      const who=c[Math.floor(Math.random()*c.length)];
      if(Math.random()<0.55*who.persona.chatty*lv) setTimeout(function(){ quip(who,'humanAllin'); },400);
    }
  }else if(act&&act.type==='fold'&&prevAgg){
    const o=G.players.find(function(x){ return x.id===prevAgg; });
    if(o&&o.isAI&&o.persona&&!o.folded&&Math.random()<0.3*o.persona.chatty*lv) quip(o,'humanFold');
  }
}
/* 没人跟、自己赢下底池：真人一般不亮牌 —— 偏偏有人爱亮出诈唬来刺激你 */
function maybeShowCards(w){
  if(!w||!w.isAI||!w.persona||w.hole.length<2) return;
  const P=w.persona, lv=[0.6,1,1.3][AIC.level==null?1:AIC.level];
  const c=classifyHand(w.hole,G.board);
  const bluffish=['bluff','semi','steal','float'].indexOf(w.lastTone)>=0||c.tier==='air'||c.tier==='weak'||c.tier==='draw';
  let ev=null;
  if(bluffish&&Math.random()<P.showBluff*lv*(G.board.length?1:0.5)) ev='showbluff';
  else if(!bluffish&&(c.tier==='monster'||c.tier==='strong')&&Math.random()<P.showValue*0.6) ev='showvalue';
  if(!ev) return;
  w.reveal=true; w._spoke=true;
  log('<small>亮牌</small><b>'+esc(w.name)+'</b> 亮出 <span class="hl">'+w.hole.map(cardText).join(' ')+'</span>'+
    (ev==='showbluff'?' —— <span style="color:var(--brick-soft)">'+(c.tier==='draw'?'没中的听牌':'诈唬')+'</span>':''));
  render();
  if(talkMode()>0) quip(w,ev);
}
/* 摊牌时记下真人的「诈唬 / 价值」，电脑以后会照这个调整抓诈频率 */
function noteShowdown(live){
  for(const p of live){
    if(!p.isHuman||!p.st||p.hole.length<2) continue;
    const aggLate=(G.hist||[]).filter(function(h){ return h.id===p.id&&h.st>=2&&h.raise; });
    if(!aggLate.length) continue;
    const c=classifyHand(p.hole,G.board);
    const lastSt=STREET_NAMES[aggLate[aggLate.length-1].st][1];
    const cards=p.hole.map(cardText).join(' ');
    if(c.tier==='air'||c.tier==='weak'||c.tier==='draw'){
      p.st.bluffs++;
      p.st.recent.push('第'+G.handNo+'手：'+lastSt+'主动下注，摊牌是 '+cards+'（'+describeHand(p.hole.concat(G.board))+'）——诈唬被看到');
    }else if(c.tier==='monster'||c.tier==='strong'){
      p.st.values++;
      p.st.recent.push('第'+G.handNo+'手：'+lastSt+'主动下注，摊牌是 '+cards+'（'+describeHand(p.hole.concat(G.board))+'）——真有牌');
    }
    if(p.st.recent.length>6) p.st.recent.shift();
  }
}
/* 一手结束：统计入账、情绪变化（大输会上头）、赢家嘚瑟、教练复盘 */
function handEnd(){
  commitHandStats();
  const lv=[0.7,1,1.3][AIC.level==null?1:AIC.level];
  for(const p of G.players){
    if(!p.isAI||!p.persona||p.out||p.left) continue;
    const P=p.persona, start=p.handStart||G.startStack, delta=p.stack-start;
    if(p._spoke){ p._spoke=false; continue; }
    if(delta<=-Math.max(G.bb*15,start*0.35)){
      if(p.tilt<=0&&P.tiltProne>0&&Math.random()<P.tiltProne*lv){
        p.tilt=3+Math.floor(Math.random()*3);
        log('<small>情绪</small><b>'+esc(p.name)+'</b> 连着输了个大池，脸色明显变了——<span style="color:var(--brick-soft)">上头了</span>。','tip');
        quip(p,'tilt');
      }else if(Math.random()<0.35*P.chatty) quip(p,'lose');
    }else if(delta>=Math.max(G.bb*15,start*0.4)){
      if(Math.random()<0.55*P.chatty) quip(p,'winbig');
    }else if(delta>0&&Math.random()<0.18*P.chatty) quip(p,'win');
  }
  coachHandEnd();
}

/* ---------- 摊牌 ---------- */
async function showdown(){
  const live=livePlayers();
  /* 其他人都弃了：赢家不用亮牌（以前这里会把赢家的底牌翻开，等于白送信息） */
  if(live.length===1){
    award(live[0],G.pot,'其他人都弃牌');
    maybeShowCards(live[0]);
    return;
  }
  G.players.forEach(function(p){ if(!p.folded&&!p.out){ p.reveal=true; if(p.hf) p.hf.wtsd=1; } });
  render();
  await sleep(600);
  noteShowdown(live);
  log('<small>摊牌 Showdown</small>公共牌 '+G.board.map(cardText).join(' '));
  live.forEach(function(p){
    log('&nbsp;&nbsp;<b>'+p.name+'</b> '+p.hole.map(cardText).join(' ')+' → <span class="hl">'+describeHand(p.hole.concat(G.board))+'</span>');
  });
  const pots=buildPots(G.players);
  for(let i=0;i<pots.length;i++){
    const pot=pots[i];
    const elig=pot.eligible.filter(function(p){return !p.folded&&!p.out;});
    if(elig.length===0) continue;
    if(elig.length===1){ award(elig[0],pot.amount,pots.length>1?'边池 '+pot.amount:''); continue; }
    let best=null,winners=[];
    for(const p of elig){
      const e=evaluate(p.hole.concat(G.board));
      if(!best||cmpHand(e,best)>0){best=e;winners=[p];}
      else if(cmpHand(e,best)===0) winners.push(p);
    }
    const share=Math.floor(pot.amount/winners.length);
    let rem=pot.amount-share*winners.length;
    for(const w of winners){
      const amt=share+(rem-->0?1:0);
      award(w,amt,winners.length>1?'平分底池':'');
    }
  }
}

function award(p,amount,note){
  p.stack+=amount;
  G.pot-=amount;
  if(G.pot<0) G.pot=0;
  if(G.winnerIds.indexOf(p.id)<0) G.winnerIds.push(p.id);
  const shown=livePlayers().length>1;
  if(shown&&p.hf) p.hf.wsd=1;
  const label=shown&&p.hole.length===2&&G.board.length>=3
    ? describeHand(p.hole.concat(G.board)) : '';
  log('<small>结果</small><b>'+esc(p.name)+'</b> 赢下 <span class="hl">'+fmt(amount)+'</span>'+(label?' · '+label:'')+(note?' · '+note:''),'res');
  if(p.isMe){
    sfxWin();
    const net=amount-p.committed;
    G.stats.net+=net;
    G.stats.wins++;
    showResult('你赢下 '+fmt(amount), (net>=0?'+':'')+fmt(net));
  }else{
    if(p.isHuman){
      /* 别的真人也赢了：结果只在他自己的客户端上弹，靠视角快照带过去 */
      NET.results[p.pid]={t:'你赢下 '+fmt(amount),v:((amount-p.committed)>=0?'+':'')+fmt(amount-p.committed),n:++NET.resultSeq};
      sfxWin();
    }else{
      const me=human();
      if(me&&!me.folded&&!me.out) sfxLose();
    }
  }
  render();
}

function act(type,amount){
  if(gamePaused) return;
  const me=human(); if(!me) return;
  if(NET.online&&!NET.isHost){
    /* 客户端：本地先做一遍合法性检查，然后交给房主裁决 */
    if(!G.waiting||!NET.started) return;
    const need=Math.max(0,G.currentBet-me.streetBet);
    if(type==='check'&&need>0) return;
    if(type==='call'&&need===0) return;
    coachRecord(type,amount);
    netSend(type,amount);
    return;
  }
  if(!G.pending) return;
  const need=Math.max(0,G.currentBet-me.streetBet);
  if(type==='check'&&need>0) return;
  if(type==='call'&&need===0) return;
  coachRecord(type,amount);
  const pend=G.pending; G.pending=null;
  G.waiting=false;
  pend.resolve({type:type,amount:amount});
  renderControls();
}

  function setSheet(open){ document.body.classList.toggle('sheet-open',!!open); }
  document.querySelectorAll('#sheetMenu button').forEach(function(b){
    b.onclick=function(){ setSheet(false); document.getElementById(b.dataset.go).click(); };
  });
  document.getElementById('btnSheet').onclick=function(){
    setSheet(!document.body.classList.contains('sheet-open'));
  };
  document.getElementById('btnSheetClose').onclick=function(){ setSheet(false); };
  document.getElementById('sheetBackdrop').onclick=function(){ setSheet(false); };
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&document.body.classList.contains('sheet-open')) setSheet(false);
  });
  document.addEventListener('keydown',function(e){
    if(document.getElementById('overlay').classList.contains('show')) return;
    const k=e.key.toLowerCase();
    /* 空格 / P：随时可以暂停与继续（即使轮到你行动） */
    if(k===' '||k==='spacebar'||k==='p'){
      if(!e.repeat){ e.preventDefault(); togglePause(); }
      return;
    }
    if(gamePaused) return;
    if(!G.waiting) return;
    if(k==='f') act('fold');
    else if(k==='c'){
      const me=human();
      if(Math.max(0,G.currentBet-me.streetBet)===0) act('check'); else act('call');
    }
    else if(k==='r'){ const b=document.getElementById('btnRaise'); if(!b.disabled) act('raise',raiseTarget()); }
    else if(k==='a'){ const b=document.getElementById('btnAllin'); if(!b.disabled) document.getElementById('btnAllin').click(); }
    else if(k==='arrowleft'||k==='arrowright'||k==='arrowup'||k==='arrowdown'){
      const s=document.getElementById('slider');
      if(!s.disabled){
        e.preventDefault();
        const dir=(k==='arrowleft'||k==='arrowdown')?-1:1;
        const step=(k==='arrowleft'||k==='arrowright')?Math.max(1,G.sb):Math.max(1,G.bb);
        setSlider(+s.value+dir*step);
      }
    }
  });
}
/* 把任意金额吸附到小盲整数倍，再夹进当前滑条的合法区间（下限 = 最小加注，上限 = 全下） */
function snapTarget(v){
  const s=document.getElementById('slider');
  const step=Math.max(1,G.sb);
  return Math.max(+s.min,Math.min(+s.max,Math.round(v/step)*step));
}
/* 倍数键的乘数基准：有人下注就是当前注，没人下注就是大盲 */
function mulBase(){ return (G.currentBet&&G.currentBet>0)?G.currentBet:G.bb; }
function setSlider(v){
  const s=document.getElementById('slider');
  if(s.disabled) return;
  v=Math.max(+s.min,Math.min(+s.max,v));
  s.value=String(v);
  updateRaiseAmt();
}

function aiHttpFail(p,status,msg){
  const s=PROV[p], n=s.name;
  if(status===401||status===403){ s.keyBad=true; s.lastErr=n+' Key 无效（'+status+'）'; }
  else if(status===402){ s.downUntil=Date.now()+600000; s.lastErr=n+' 余额不足'; }
  else if(status===404&&p==='claude'){ s.keyBad=true; s.lastErr='这个 Key 用不了 '+AIC.claudeModel; }
  else if(status===429){ s.downUntil=Date.now()+20000; s.lastErr=n+' 请求太频繁'; }
  else if(status===529){ s.downUntil=Date.now()+15000; s.lastErr=n+' 繁忙，稍后再试'; }
  else{
    s.fails++; s.lastErr=n+' 出错 '+status;
    if(s.fails>=3){ s.downUntil=Date.now()+60000; s.lastErr+='，60 秒后重试'; }
  }
  if(msg&&typeof console!=='undefined') console.warn('['+n+']',status,msg);
  aiToast(s.lastErr);
  updateAIDot();
}

  const s=PROV[p];

  s.lastErr=kind==='timeout'?s.name+' 响应超时':'连不上 '+s.name;
  if(s.fails>=3){ s.downUntil=Date.now()+60000; s.lastErr+='，60 秒后重试'; aiToast(s.lastErr); }
  updateAIDot();
}

/* ---------- claude.ai 页面里的 Claude（用浏览者自己的账号，不用 Key） ----------
   没有 system 角色：系统提示放进第一条 user；对手要快用 quick，教练用 default。第一次调用会请你点「允许」。 */
async function siteChat(role,o){
  if(!SITE) throw new Error('nokey');
  const sys=o.messages.filter(function(m){ return m.role==='system'; }).map(function(m){ return m.content; }).join('\n\n');
  const turns=o.messages.filter(function(m){ return m.role!=='system'&&m.content; }).map(function(m){ return {role:m.role==='assistant'?'assistant':'user',content:String(m.content)}; });
  let head=sys;
  if(o.json) head+=(head?'\n\n':'')+'只回复一个 JSON 对象，不要任何别的文字。'+(o.schema?'格式：'+JSON.stringify(o.schema):'');
  if(head) turns.unshift({role:'user',content:head});
  if(!turns.length||turns[turns.length-1].role!=='user') turns.push({role:'user',content:'继续。'});
  const ctl=new AbortController();
  let timedOut=false;
  const timer=setTimeout(function(){ timedOut=true; ctl.abort(); },o.timeoutMs||25000);
  const onAbort=function(){ ctl.abort(); };
  if(o.signal){ if(o.signal.aborted) ctl.abort(); else o.signal.addEventListener('abort',onAbort); }
  const S=PROV.site;
  try{
    const opts={signal:ctl.signal,cache:false,modelTier:role==='opp'?'quick':'default'};
    if(o.onDelta) opts.onText=function(u){ o.onDelta(u.text); };
    const r=await SITE(turns,opts);
    aiOk('site');
    return r.text||'';
  }catch(e){
    const code=e&&e.code||'';
    if(code==='cancelled'){
      if(timedOut) aiNetFail('site','timeout');
      throw new Error(timedOut?'timeout':'abort');
    }
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){
      S.keyBad=true; S.lastErr=code==='not_granted'?'没有允许这个页面使用 Claude':'这个账号现在用不了 Claude';
    }else if(code==='rate_limited'){ S.downUntil=Date.now()+60000; S.lastErr='Claude 用量到上限了，稍后再试'; }
    else if(code==='session_expired'){ S.keyBad=true; S.lastErr='claude.ai 登录过期，重新登录后刷新'; }
    else{ S.fails++; S.lastErr='Claude 出错（'+(code||'未知')+'）'; if(S.fails>=3){ S.downUntil=Date.now()+60000; S.lastErr+='，60 秒后重试'; } }
    aiToast(S.lastErr); updateAIDot();
    throw new Error('http '+(code||'site'));
  }finally{
    clearTimeout(timer);
    if(o.signal) o.signal.removeEventListener('abort',onAbort);
  }
}
/* 带超时、可取消的 fetch；把「超时」和「调用方取消」区分开 */
async function aiFetch(p,url,init,o,run){
  const ctl=new AbortController();
  let timedOut=false;
  const timer=setTimeout(function(){ timedOut=true; ctl.abort(); },o.timeoutMs||9000);
  const onAbort=function(){ ctl.abort(); };
  if(o.signal){ if(o.signal.aborted) ctl.abort(); else o.signal.addEventListener('abort',onAbort); }
  try{
    init.signal=ctl.signal;
    const r=await fetch(url,init);
    return await run(r);
  }catch(e){
    if(ctl.signal.aborted&&!timedOut) throw e;
    if(!(e&&/^(http|retry) /.test(e.message||''))) aiNetFail(p,timedOut?'timeout':'network');
    throw e;
  }finally{
    clearTimeout(timer);
    if(o.signal) o.signal.removeEventListener('abort',onAbort);
  }
}
/* 逐行读 SSE，每个 data: 交给 onData */
async function readSSE(r,onData){
  const rd=r.body.getReader(), dec=new TextDecoder();
  let buf='';
  for(;;){
    const x=await rd.read();
    if(x.done) break;
    buf+=dec.decode(x.value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(line.indexOf('data:')!==0) continue;
      const data=line.slice(5).trim();
      if(!data||data==='[DONE]') continue;
      let j=null;
      try{ j=JSON.parse(data); }catch(e){ continue; }
      onData(j);
    }
  }
}

/* ---------- DeepSeek（OpenAI 兼容格式） ---------- */
async function dsChat(o){
  if(!AIC.key) throw new Error('nokey');
  const S=PROV.deepseek;
  const body={model:AIC.model||'deepseek-flash',messages:o.messages,max_tokens:o.maxTokens||200,
    temperature:o.temperature==null?1:o.temperature};
  if(!S.noThink) body.thinking={type:'disabled'};      /* 牌桌上要的是快：关掉推理模式 */
  if(o.json) body.response_format={type:'json_object'};
  if(o.onDelta){ body.stream=true; body.stream_options={include_usage:true}; }
  const base=String(AIC.base||'https://api.deepseek.com').trim().replace(/\/+$/,'');
  let retry=false;
  const out=await aiFetch('deepseek',base+'/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+AIC.key},body:JSON.stringify(body)},o,
    async function(r){
      if(!r.ok){
        let msg='';
        try{ const j=await r.json(); msg=(j&&j.error&&j.error.message)||''; }catch(e){}
        /* 换了不认识 thinking 参数的模型：去掉再试一次 */
        if(r.status===400&&!S.noThink&&/thinking/i.test(msg)){ S.noThink=true; retry=true; throw new Error('retry thinking'); }
        aiHttpFail('deepseek',r.status,msg);
        throw new Error('http '+r.status);
      }
      let text='';
      if(!o.onDelta||!r.body||!r.body.getReader){
        const j=await r.json();
        text=(j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
        if(j&&j.usage&&j.usage.total_tokens) AIC.tokens+=j.usage.total_tokens;
        if(o.onDelta&&text) o.onDelta(text);
      }else{
        await readSSE(r,function(j){
          const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(c){ text+=c; o.onDelta(text); }
          if(j.usage&&j.usage.total_tokens) AIC.tokens+=j.usage.total_tokens;
        });
      }
      aiOk('deepseek');
      return text;
    }).catch(function(e){ if(retry) return dsChat(o); throw e; });
  return out;
}

/* ---------- Claude（Anthropic Messages API） ----------
   浏览器直连要带 anthropic-dangerous-direct-browser-access，否则跨域会被拦。
   Opus 5.5 的思考无法关闭，用 effort 控制深浅（默认 medium）；也不接受 temperature。
   默认开启服务端兜底（fallbacks: "default"）：极少数被安全分类器拒绝时自动换模型重答。 */
async function claudeChat(o){
  if(!AIC.claudeKey) throw new Error('nokey');
  const S=PROV.claude;
  const sys=o.messages.filter(function(m){ return m.role==='system'; }).map(function(m){ return m.content; }).join('\n\n');
  const msgs=o.messages.filter(function(m){ return m.role!=='system'; });
  /* 思考也算在 max_tokens 里，给足空间，免得答到一半被截断 */
  const body={model:AIC.claudeModel||'claude-opus-5-5',max_tokens:Math.max(o.onDelta?8000:4000,o.maxTokens||0),
    messages:msgs,output_config:{effort:AIC.claudeEffort||'medium'}};
  if(sys) body.system=sys;
  if(o.json&&o.schema) body.output_config.format={type:'json_schema',schema:o.schema};
  if(o.onDelta) body.stream=true;
  const headers={'content-type':'application/json','x-api-key':AIC.claudeKey,'anthropic-version':'2023-06-01',
    'anthropic-dangerous-direct-browser-access':'true'};
  if(!S.noFallback){ body.fallbacks='default'; headers['anthropic-beta']='server-side-fallback-2026-07-01'; }
  let retry=false;
  return aiFetch('claude','https://api.anthropic.com/v1/messages',{method:'POST',headers:headers,body:JSON.stringify(body)},o,
    async function(r){
      if(!r.ok){
        let msg='';
        try{ const j=await r.json(); msg=(j&&j.error&&j.error.message)||''; }catch(e){}
        /* 账号没开兜底 beta：去掉再试一次 */
        if(r.status===400&&!S.noFallback&&/anthropic-beta|fallback/i.test(msg)){ S.noFallback=true; retry=true; throw new Error('retry fallback'); }
        aiHttpFail('claude',r.status,msg);
        throw new Error('http '+r.status);
      }
      let text='', stop='';
      if(!o.onDelta||!r.body||!r.body.getReader){
        const j=await r.json();
        stop=j&&j.stop_reason||'';
        text=((j&&j.content)||[]).filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('');
        if(j&&j.usage) AIC.tokens+=(j.usage.input_tokens||0)+(j.usage.output_tokens||0);
        if(o.onDelta&&text) o.onDelta(text);
      }else{
        let streamErr=null;
        await readSSE(r,function(j){
          if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'&&j.delta.text){ text+=j.delta.text; o.onDelta(text); }
          else if(j.type==='message_start'&&j.message&&j.message.usage) AIC.tokens+=j.message.usage.input_tokens||0;
          else if(j.type==='message_delta'){
            if(j.delta&&j.delta.stop_reason) stop=j.delta.stop_reason;
            if(j.usage&&j.usage.output_tokens) AIC.tokens+=j.usage.output_tokens;
          }
          else if(j.type==='error') streamErr=j.error||{};
        });
        if(streamErr){
          aiHttpFail('claude',streamErr.type==='overloaded_error'?529:500,streamErr.message||'');
          throw new Error('http stream');
        }
      }
      if(stop==='refusal'&&!text) throw new Error('http refusal');
      aiOk('claude');
      return text;
    }).catch(function(e){ if(retry) return claudeChat(o); throw e; });
}
function parseJSONLoose(t){
  try{ return JSON.parse(t); }catch(e){}
  const m=String(t||'').match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
function cleanSay(t){
  t=String(t||'').replace(/[\r\n\t]+/g,' ').replace(/^["“「『'\s]+|["”」』'\s]+$/g,'').trim();
  if(/^(?:say|台词)[:：]/i.test(t)) t=t.replace(/^(?:say|台词)[:：]\s*/i,'');
  return t.length>24?t.slice(0,24):t;
}

/* 校验 + 护栏：动作必须合法；不准弃掉坚果、不准河牌拿空气去跟大注 */
function validateLLMDecision(j,s,d){
  const map={fold:'fold',check:'check',call:'call',raise:'raise',bet:'raise',allin:'allin','all-in':'allin',all_in:'allin',
    '弃牌':'fold','过牌':'check','跟注':'call','加注':'raise','下注':'raise','全下':'allin'};
  const a=map[String(j.action||'').toLowerCase().trim()];
  if(!a) return null;
  const canRaise=s.maxTo>s.currentBet;
  let out;
  if(a==='allin') out=canRaise?{type:'raise',amount:s.maxTo}:{type:'call'};
  else if(a==='raise'){
    if(!canRaise) out={type:'call'};
    else{
      let to=Math.round(Number(j.to!=null?j.to:j.amount));
      if(!isFinite(to)||to<=0) to=d.type==='raise'?d.amount:s.minTo;
      const step=Math.max(1,s.sb);
      to=Math.round(to/step)*step;
      to=Math.max(s.minTo,Math.min(s.maxTo,to));
      if(to>=s.maxTo*0.9) to=s.maxTo;
      out={type:'raise',amount:to};
    }
  }
  else if(a==='fold') out=s.need>0?{type:'fold'}:{type:'check'};
  else if(a==='check'){ if(s.need>0) return null; out={type:'check'}; }
  else out=s.need>0?{type:'call'}:{type:'check'};
  if(out.type==='call'&&s.need<=0) out={type:'check'};
  const potOdds=s.need>0?s.need/(s.pot+s.need):0;
  if(out.type==='fold'&&(s.eq>=0.72||s.cls.tier==='monster')) return null;
  if(out.type==='call'&&s.street===3&&s.eq<0.08&&s.need>s.bb) return null;
  if(out.type==='call'&&s.need>=s.stack*0.5&&s.eq<potOdds*0.6) return null;
  let tone=out.type;
  if(out.type==='raise') tone=(s.cls.tier==='monster'||s.cls.tier==='strong'||s.eq>=0.6)?'value':(s.cls.tier==='draw'?'semi':'bluff');
  const add=out.type==='raise'?out.amount-s.streetBet:0;
  const dd={type:out.type,amount:out.amount,tone:tone,
    plan:out.type==='raise'?(tone==='value'?'value':'barrel'):(out.type===d.type?d.plan:null),
    allin:out.type==='raise'&&out.amount>=s.maxTo,
    big:out.type==='raise'?(out.amount>=s.maxTo||add>=s.stack*0.4||add>=s.pot*1.1):(out.type==='call'&&s.need>=s.stack*0.35)};
  return {d:dd,say:cleanSay(j.say),why:String(j.why||'')};
}
const DECIDE_SCHEMA={type:'object',additionalProperties:false,required:['action','to','say','why'],
  properties:{action:{type:'string',enum:['fold','check','call','raise','allin']},to:{type:'integer'},say:{type:'string'},why:{type:'string'}}};
async function dsDecide(p,s,d){
  try{
    const txt=await aiChat('opp',{messages:[{role:'system',content:brainSystemPrompt(p)},
      {role:'user',content:JSON.stringify(aiSituation(p,s,d))}],json:true,schema:DECIDE_SCHEMA,maxTokens:180,temperature:1.05,
      timeoutMs:roleProv('opp')!=='deepseek'?25000:8000});
    const j=parseJSONLoose(txt);
    return j?validateLLMDecision(j,s,d):null;
  }catch(e){ return null; }
}

  const tester=function(p,keyId,modelId,set){
